<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/ico" href="/favicon.ico"/>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMC VAULT 1.62</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

        :root {
            --bright-green: #00FF41;
            --dark-green: #003B00;
            --bg-black: #050505;
            --crt-glow: 0 0 10px rgba(0, 255, 65, 0.2);
            --amber: #ffb000;
        }

        body.override {
            --bright-green: var(--amber);
            --dark-green: #5e4100;
            --crt-glow: 0 0 10px rgba(255, 176, 0, 0.2);
        }

        body {
            background-color: var(--bg-black);
            color: var(--bright-green);
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-transform: uppercase;
        }

        body::after, #image-modal::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 120;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
            will-change: auto;
        }

        .scanline {
            width: 100%;
            height: 100px;
            z-index: 121;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(0, 255, 65, 0.05) 50%, rgba(0, 0, 0, 0) 100%);
            opacity: 0.1;
            position: fixed;
            top: 0;
            left: 0;
            animation: scanline 8s linear infinite;
            pointer-events: none;
            will-change: transform;
        }

        @keyframes scanline {
            0% { transform: translateY(-100px); }
            100% { transform: translateY(100vh); }
        }

        .monitor-frame {
            padding: 25px; background: #121212; border: 12px solid #222;
            border-radius: 40px; box-shadow: inset 0 0 50px #000, 0 20px 50px rgba(0,0,0,0.8);
            position: relative; z-index: 5;
            max-width: 96vw;
            max-height: 96vh;
            box-sizing: border-box;
        }

        .crt-screen {
            width: min(850px, calc(96vw - 74px));
            height: min(550px, calc(96vh - 74px));
            min-width: 320px;
            min-height: 420px;
            background: var(--bg-black);
            position: relative; overflow: hidden; border: 15px solid #111; border-radius: 10px;
            box-sizing: border-box;
        }

        #terminal-content { padding: 15px; height: 100%; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden; }

        .system-stats {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
            border-bottom: 1px solid var(--dark-green); padding-bottom: 8px; font-size: 8.5pt; opacity: 0.8;
        }

        .path { background: var(--bright-green); color: var(--bg-black); padding: 2px 8px; margin: 10px 0; font-weight: bold; }
        
        ul { list-style: none; padding: 0; flex-grow: 1; overflow-y: auto; scroll-behavior: smooth; }
        li { padding: 4px 10px; cursor: pointer; white-space: pre; border-left: 3px solid transparent; }
        li.selected { background: var(--bright-green); color: var(--bg-black); border-left: 3px solid var(--amber); }

        .card-view { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; animation: flicker 0.15s infinite; }
        @keyframes flicker { 0% { opacity: 0.98; } 50% { opacity: 1; } 100% { opacity: 0.99; } }

        .terminal-img, #modal-img {
            border: 1px solid var(--bright-green);
            filter: contrast(1) brightness(1);
            box-shadow: var(--crt-glow);
        }

        .terminal-img {
            max-height: 250px;
            max-width: 90%;
            cursor: zoom-in !important;
        }

        #image-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.98); z-index: 110;
            justify-content: center; align-items: center; cursor: zoom-out;
            animation: flicker 0.15s infinite;
        }

        #image-modal,
        #modal-img {
            cursor: zoom-out !important;
        }

        #modal-img {
            max-width: 90%;
            max-height: 90%;
        }

        .metadata-table { width: 100%; border-collapse: collapse; font-size: 8pt; margin-top: 5px; }
        .metadata-table td {
            border: 1px solid var(--dark-green);
            padding: 4px 10px;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .glitch { animation: glitch-text 0.5s infinite; }
        @keyframes glitch-text {
            0% { text-shadow: 2px 0 red, -2px 0 blue; transform: translate(1px, 1px); }
            50% { text-shadow: -2px 0 red, 2px 0 blue; transform: translate(-1px, -1px); }
            100% { text-shadow: 2px 0 red, -2px 0 blue; transform: translate(1px, -1px); }
        }

        .clickable { cursor: pointer; padding: 2px 8px; border: 1px solid transparent; }
        .clickable:hover, .clickable.selected { background: var(--bright-green); color: var(--bg-black); }

        #system-message {
            display: none;
            position: absolute;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            width: 72%;
            padding: 12px 16px;
            background: rgba(5, 5, 5, 0.96);
            border: 1px solid var(--bright-green);
            box-shadow: var(--crt-glow);
            z-index: 130;
            font-size: 8.5pt;
            line-height: 1.5;
        }

        #system-message .system-title {
            display: inline-block;
            margin-bottom: 6px;
            padding: 1px 6px;
            background: var(--bright-green);
            color: var(--bg-black);
            font-weight: bold;
        }

        #system-message .prompt-options {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        #system-message .prompt-hint {
            margin-top: 8px;
            opacity: 0.75;
            font-size: 7.5pt;
        }


        @media (max-width: 720px) {
            .monitor-frame {
                padding: 12px;
                border-width: 6px;
                border-radius: 24px;
            }

            .crt-screen {
                width: calc(100vw - 48px);
                height: calc(100vh - 48px);
                border-width: 8px;
            }

            #terminal-content {
                padding: 10px;
            }

            .system-stats {
                grid-template-columns: 1fr;
                gap: 6px;
                font-size: 7.5pt;
            }

            .terminal-img {
                max-height: 210px;
            }

            #system-message {
                position: fixed;
                width: 82%;
                bottom: 18px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .scanline,
            .card-view,
            .glitch,
            .purring,
            #image-modal {
                animation: none !important;
            }

            body::after,
            #image-modal::after {
                opacity: 0.15;
            }
        }



        /* --- Secret Chess Gremlin mini-game --- */
        .chess-wrap { display: grid; grid-template-columns: minmax(260px, 400px) 1fr; gap: 16px; height: calc(100% - 92px); min-height: 0; align-items: start; overflow: hidden; }
        #chess-board { width: min(400px, 52vh, 88vw); height: min(400px, 52vh, 88vw); display: grid; grid-template-columns: repeat(8,1fr); grid-template-rows: repeat(8,1fr); border: 2px solid var(--bright-green); box-shadow: var(--crt-glow); position: relative; overflow:hidden; transition: filter .2s, transform .2s; }
        #chess-board.cheat-glitch { animation: board-corrupt .22s steps(2,end) 8; filter: hue-rotate(40deg) saturate(2) contrast(1.4); }
        @keyframes board-corrupt { 0%{transform:translate(0,0) skew(0deg)} 25%{transform:translate(2px,-1px) skew(.5deg)} 50%{transform:translate(-2px,1px) skew(-.5deg)} 75%{transform:translate(1px,2px)} 100%{transform:translate(0,0)} }
        .chess-square { position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow:hidden; }
        .chess-square.light { background: #141414; }
        .chess-square.dark { background: #030303; }
        .chess-square.cursor { outline: 3px solid var(--amber); outline-offset: -3px; z-index:2; }
        .chess-square.pick { box-shadow: inset 0 0 0 3px var(--bright-green); }
        .chess-square.last { box-shadow: inset 0 0 14px rgba(255,176,0,.55); }
        .chess-square.legal::after { content:""; width: 14px; height:14px; border: 1px solid var(--bright-green); border-radius:50%; opacity:.85; position:absolute; }
        .chess-piece { width: 96%; height: 96%; image-rendering: pixelated; filter: drop-shadow(0 0 2px var(--bright-green)); transition: transform .18s ease, filter .18s ease; position:relative; z-index:1; display:flex; align-items:center; justify-content:center; }
        .chess-piece.moved { animation: piece-pop .22s ease; }
        .chess-piece.thinking { animation: think-wiggle .25s steps(2,end) infinite; }
        .chess-piece canvas { width:100%; height:100%; image-rendering: pixelated; }
        .chess-piece::after { content: attr(data-fallback); color: var(--bright-green); font-weight:bold; font-size: 26px; position:absolute; inset:0; display:none; align-items:center; justify-content:center; text-shadow:0 0 8px var(--bright-green); }
        body.sprite-fallback .chess-piece { border:1px solid var(--dark-green); }
        body.sprite-fallback .chess-piece::after { display:flex; }
        .chess-boom { position:absolute; inset:8%; border:2px solid var(--amber); border-radius:50%; animation: chess-boom .42s ease-out forwards; pointer-events:none; z-index:3; }
        @keyframes chess-boom { from{transform:scale(.1); opacity:1;} to{transform:scale(1.8); opacity:0;} }
        @keyframes piece-pop { 0%{transform:scale(.7)} 60%{transform:scale(1.12)} 100%{transform:scale(1)} }
        @keyframes think-wiggle { 0%,100%{transform:translateX(0)} 50%{transform:translateX(1px)} }
        .chess-panel { font-size: 8pt; line-height: 1.45; align-self: stretch; display:flex; flex-direction:column; gap:7px; overflow-y:auto; overflow-x:hidden; min-height:0; padding-right:4px; box-sizing:border-box; }
        .chess-log { border: 1px solid var(--dark-green); padding: 8px; min-height: 88px; max-height: 142px; overflow-y:auto; background:rgba(0,0,0,.35); flex:0 1 auto; }
        .chess-stats { border:1px solid var(--dark-green); padding:5px 8px; display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
        .chess-help { opacity:.9; border-top:1px solid var(--dark-green); padding-top:8px; }
        .chess-actions { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
        .chess-actions .clickable { border:1px solid var(--dark-green); }
        .chess-history { border: 1px solid var(--dark-green); padding: 6px; min-height: 78px; max-height: 112px; overflow-y:auto; font-size:7.3pt; opacity:.95; flex:0 0 auto; background:rgba(0,0,0,.22); }
        .crt-screen.crt-damage-1 { filter: saturate(1.15) contrast(1.05); }
        .crt-screen.crt-damage-2 { animation: board-corrupt .38s steps(2,end) infinite; filter: hue-rotate(8deg) saturate(1.35) contrast(1.15); }
        .crt-screen.crt-damage-3 { animation: board-corrupt .22s steps(2,end) infinite; filter: hue-rotate(22deg) saturate(1.8) contrast(1.35); }
        .chess-square.check { outline: 3px solid #ffb000; outline-offset: -6px; animation: piece-pop .35s ease infinite alternate; }
        .prompt-options { margin-top: 10px; display:flex; gap:12px; justify-content:center; }
        .prompt-hint { margin-top:8px; opacity:.75; font-size:7.5pt; }
        @media (max-width: 720px) { .chess-wrap { grid-template-columns: 1fr; gap: 8px; overflow-y:auto; height: calc(100% - 82px); } #chess-board { width: min(82vw, 360px); height: min(82vw, 360px); justify-self:center; } .chess-panel { font-size:7pt; overflow:visible; } .chess-history { min-height:70px; } }

        .keypad-grid { display: grid; grid-template-columns: repeat(3, 60px); gap: 10px; margin-top: 20px; }
        .pin-btn { 
            background: transparent; border: 1px solid var(--bright-green); 
            color: var(--bright-green); font-family: 'JetBrains Mono', monospace; 
            padding: 10px; cursor: pointer; font-size: 1.2rem;
            transition: background 0.05s, color 0.05s;
        }
        /* Hover effect still allowed, but default selection removed */
        .pin-btn:hover { background: var(--dark-green); }
        .pin-btn.active-flash { background: var(--bright-green) !important; color: #000 !important; }

        #idle-pet {
            position: absolute; bottom: 10px; right: 10px; font-size: 6pt;
            opacity: 0; transition: opacity 2s; pointer-events: none; color: var(--bright-green);
        }
        .purring { animation: purr-vibration 0.1s infinite; }
        @keyframes purr-vibration {
            0% { transform: translate(0, 0); }
            50% { transform: translate(0.5px, 0.5px); }
            100% { transform: translate(0, 0); }
        }
    
        /* Chess fit patch: prevent the board border from clipping at the bottom. */
        .chess-wrap {
            align-items: flex-start !important;
            overflow: visible !important;
        }
        .chess-board {
            width: min(43vw, 480px, calc(100vh - 300px)) !important;
            height: min(43vw, 480px, calc(100vh - 300px)) !important;
            min-width: 360px;
            min-height: 360px;
            box-sizing: border-box !important;
            flex: 0 0 auto !important;
        }
        .chess-square {
            min-width: 0;
            min-height: 0;
        }
        .chess-piece {
            width: 86% !important;
            height: 86% !important;
        }
        @media (max-height: 820px) {
            .chess-board {
                width: min(41vw, 440px, calc(100vh - 320px)) !important;
                height: min(41vw, 440px, calc(100vh - 320px)) !important;
                min-width: 320px;
                min-height: 320px;
            }
            .chess-side {
                font-size: 7.8pt !important;
            }
            .chess-log {
                max-height: 170px !important;
            }
        }

    </style>
</head>
<body onkeydown="handleKeyDown(event)">

<div id="image-modal" onclick="closeModal()">
    <img id="modal-img" src="" alt="Enlarged View">
</div>

<div id="idle-pet">
    <pre>
      |\      _,,,---,,_
ZZZzz /,`.-'`'    -.  ;-;;,_
     |,4-  ) )-,_. ,\ (  `'-'
    '---''(_/--'  `-'\_)
    </pre>
</div>

<div class="scanline"></div>

<div class="monitor-frame">
    <div class="crt-screen" id="crt-screen">
        <div id="terminal-content">
            <!-- Initial Splash Logic will be injected here via renderSplash -->
        </div>
        <div id="system-message" role="status" aria-live="polite"></div>
    </div>
</div>

<script src="database.js"></script>
<script>
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    let purrOsc, purrGain;
    const konamiCode = ["ArrowUp", "ArrowUp", "ArrowDown", "ArrowDown", "ArrowLeft", "ArrowRight", "ArrowLeft", "ArrowRight", "b", "a"];
    let konamiIndex = 0;
    let idleTimer, sessionTimeout;
    let systemMessageTimer;

    function showSystemMessage(title, lines = [], duration = 4500) {
        const box = document.getElementById("system-message");
        if (!box) return;

        clearTimeout(systemMessageTimer);

        box.innerHTML = `
            <div class="system-title">${title}</div>
            ${lines.map(line => `<div>&gt; ${line}</div>`).join("")}
        `;

        box.style.display = "block";

        systemMessageTimer = setTimeout(() => {
            box.style.display = "none";
        }, duration);
    }

    function hideSystemMessage() {
        clearTimeout(systemMessageTimer);
        const box = document.getElementById("system-message");
        if (box) {
            box.style.display = "none";
            box.innerHTML = "";
        }
    }

    function showSaveHelp(event, url) {
        if (event) {
            event.preventDefault();
            event.stopPropagation();
        }

        playSound(900, "sine", 0.08, 0.04);

        showSystemMessage("SAVE IMAGE HELP", [
            "DIRECT DOWNLOAD IS BLOCKED BY THE IMAGE HOST",
            "RIGHT-CLICK THE IMAGE",
            "SELECT SAVE IMAGE AS",
            "EXPECTED FILE FORMAT: WEBP"
        ]);
    }




    const terminal = document.getElementById('terminal-content');

    function escapeHTML(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function escapeJS(value) {
        return String(value ?? "")
            .replace(/\\/g, "\\\\")
            .replace(/'/g, "\\'")
            .replace(/\n/g, "\\n")
            .replace(/\r/g, "\\r");
    }

    function getDatabase() {
        return window.database || (typeof database !== "undefined" ? database : null);
    }

    function databaseReady() {
        const db = getDatabase();
        return db && typeof db === "object";
    }

    function renderDatabaseError() {
        viewState = "error";
        selectedIndex = 0;
        terminal.innerHTML = getHeader() + `
            <div class="path">A:\\SYSTEM\\ERROR</div>
            <div class="card-view">
                <p class="glitch">DATABASE.JS NOT FOUND OR FAILED TO LOAD</p>
                <p>PLACE DATABASE.JS IN THE SAME FOLDER AS THIS HTML FILE</p>
                <p class="clickable" onclick="location.reload()">[ RETRY ]</p>
            </div>
        `;
        refreshSelectableItems();
        updateSelection();
    }

    let inputBuffer = "";
    const CORRECT_PIN_HASH = "b20a51d1d0cd4d4e2f5c6f6b9939e8a4d4db0fb202efc513a8e1cddf9021bf4e";
    const SECRET_PIN_HASH = "4dea5c7cb70f50322ec9d734aa4aa078be9227c05251e18991c596f387552370";
    const CHESS_PIN_HASH = "3a0e14026c6b1d6b4cae899e451e9ebcbd9646c44a956440f2227b2212447be6"; // PIN 2600
    let isSecretAccess = false;

    async function sha256(text) {
        const data = new TextEncoder().encode(text);
        const hashBuffer = await crypto.subtle.digest("SHA-256", data);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2,"0")).join("");
    }
    let selectedIndex = 0;
    let viewState = "splash";
    let currentFolderName = "";
    let currentSubFolder = "";
    let currentFileIndex = 0;
    let folderSelections = {};
    let navigationMode = "mouse";
    let splashTypeBuffer = "";
    let escapeInputBuffer = "";
    let escapeTerminalLines = [];
    let escapeShellBootTime = Date.now();
    let escapeScanlinesSoft = false;

    function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }

    function playSound(freq, type, dur, vol) {
        if (typeof chess !== 'undefined' && chess.boopsOn === false) return;
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    function startPurr() {
        initAudio();
        purrOsc = audioCtx.createOscillator();
        const lfo = audioCtx.createOscillator();
        purrGain = audioCtx.createGain();
        const lfoGain = audioCtx.createGain();
        purrOsc.type = 'sawtooth'; purrOsc.frequency.setValueAtTime(25, audioCtx.currentTime);
        lfo.frequency.setValueAtTime(2, audioCtx.currentTime);
        lfoGain.gain.setValueAtTime(0.005, audioCtx.currentTime);
        lfo.connect(lfoGain); lfoGain.connect(purrGain.gain);
        purrGain.gain.setValueAtTime(0.01, audioCtx.currentTime);
        purrOsc.connect(purrGain); purrGain.connect(audioCtx.destination);
        purrOsc.start(); lfo.start();
        document.getElementById('idle-pet').classList.add('purring');
    }

    function stopPurr() {
        if (purrOsc) { try { purrOsc.stop(); purrOsc.disconnect(); } catch(e){} }
        document.getElementById('idle-pet').classList.remove('purring');
    }

    function resetIdle() {
        const pet = document.getElementById('idle-pet');
        pet.style.opacity = "0"; stopPurr();
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => { pet.style.opacity = "0.6"; startPurr(); }, 20000);

        // Security Auto-Lock (3 Minutes) - Returns to Splash Screen
        clearTimeout(sessionTimeout);
        if (viewState !== "splash") {
            sessionTimeout = setTimeout(() => {
                playSound(150, 'sawtooth', 0.5, 0.2);
                renderSplash();
            }, 180000); 
        }
    }

    function getHeader() {
        return `
            <div class="system-stats">
                <div>CPU [|||||| 42%] <br> MEM [||| 1.2GB/8GB]</div>
                <div style="text-align: right">USER: ${isSecretAccess ? "ROOT" : "GUEST"}<br>TIME: ${new Date().toLocaleTimeString()}</div>
            </div>
        `;
    }


    function navigateModalGallery(direction) {
        const db = getDatabase();
        if (!db) return renderDatabaseError();

        const files = currentSubFolder ? db[currentFolderName][currentSubFolder] : db[currentFolderName];
        if (!files || !files.length) return renderDatabaseError();

        currentFileIndex = (currentFileIndex + direction + files.length) % files.length;
        const selectionKey = `${currentFolderName}::${currentSubFolder}`;
        folderSelections[selectionKey] = currentFileIndex + 1;

        const card = files[currentFileIndex];
        const modalImg = document.getElementById("modal-img");
        modalImg.src = card.file;
        modalImg.alt = card.caption || `${card.title}.IMG`;

        playSound(1500, "sine", 0.05, 0.04);
    }

    function handleKeyDown(e) {
        navigationMode = "keyboard";
        resetIdle();

        if (e.key === konamiCode[konamiIndex]) {
            konamiIndex++;
            if (konamiIndex === konamiCode.length) {
                document.body.classList.toggle('override');
                playSound(2000, 'sine', 0.2, 0.1);
                konamiIndex = 0;
            }
        } else { konamiIndex = 0; }

        if (viewState === "chess") { handleChessKeyDown(e); return; }

        if (document.getElementById('image-modal').style.display === 'flex') {
            if (e.key === "Escape" || e.key === "Enter") closeModal();
            else if (e.key === "ArrowRight") {
                navigateModalGallery(1);
            } else if (e.key === "ArrowLeft") {
                navigateModalGallery(-1);
            }
            return;
        }

        if (viewState === "splash") { handleSplashKeyDown(e); return; }
        if (viewState === "escape-terminal") { handleEscapeTerminalKeyDown(e); return; }

        const items = terminal.querySelectorAll('li, .pin-btn, .clickable');
        
        if (e.key === "ArrowDown") {
            selectedIndex = (selectedIndex + 1) % items.length;
            playSound(1200, 'sine', 0.01, 0.05);
            updateSelection();
        } else if (e.key === "ArrowUp") {
            selectedIndex = (selectedIndex - 1 + items.length) % items.length;
            playSound(1200, 'sine', 0.01, 0.05);
            updateSelection();
        } else if (e.key === "Enter" && items[selectedIndex]) {
            items[selectedIndex].click();

            playSound(600, 'sine', 0.1, 0.05);
            if (viewState === "root") renderSplash();

            else if (viewState === "dir") renderRoot();
            else if (viewState === "file") openDir(currentFolderName, true, currentSubFolder);
        } else if (viewState === "file" && e.key === "ArrowRight") navigateGallery(1);

        else if (!isNaN(e.key) && viewState === "pin") pressKey(e.key);

    function refreshSelectableItems() {
        const items = terminal.querySelectorAll('li, .pin-btn, .clickable');
        items.forEach((item, idx) => {
            item.addEventListener("mouseenter", () => {
                if (navigationMode !== "mouse") return;

                selectedIndex = idx;
                updateSelection();
            });
            item.addEventListener("mousemove", () => {
                navigationMode = "mouse";
            });
            item.addEventListener("click", () => {
                navigationMode = "mouse";
                selectedIndex = idx;
                updateSelection();
            });
        });
    }

    function updateSelection() {
        const items = terminal.querySelectorAll('li, .pin-btn, .clickable');
        items.forEach((item, idx) => {
            const isSelected = idx === selectedIndex;
            item.classList.toggle('selected', isSelected);
            if (isSelected && (viewState === "dir" || viewState === "root")) {
                item.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        });
    }

    function showEndRank(){
        const st=chessStats();
        const ranks=['JUNIOR MONARCH HANDLER','PAWN RESOURCES INTERN','KNIGHT COMPLIANCE OFFICER','ROOK HALLWAY SUPERVISOR','BISHOP OF UNVERIFIED DIAGONALS'];
        const idx=Math.min(ranks.length-1, Math.floor(((st.wins||0)+(st.cheats||0)+(st.shame||0))/3));
        chessSay('RANK AWARDED: ' + ranks[idx] + '.', false);
    }

    function renderChess() {
        viewState='chess'; selectedIndex=0;
        updateWizardPhase(); updateCrtDamage();
        const st=chessStats(), score=boardScore(), chk=inCheck(chess.turn);
        const mode = chess.corruption ? 'CORRUPTED MODE' : 'FAIR MODE';
        const checkedKing = chk ? findKing(chess.turn) : null;
        terminal.innerHTML = getHeader() + `<div class="path">A:\\SECRET_GAMES\\CHESS_WIZARD.EXE</div>
        <div class="chess-wrap"><div id="chess-board" class="${(chess.glitch||chess.corruption)?'cheat-glitch':''}"></div><div class="chess-panel">
        <p class="glitch" style="text-align:center;font-size:18pt;letter-spacing:2px;text-shadow:0 0 12px var(--bright-green);margin:0 0 12px 0;">CHESS WIZARD</p>
        <div>TURN: ${chess.over?'GAME OVER':chess.thinking?'CHESS WIZARD IS PRETENDING TO THINK':(chess.turn==='w'?'YOU / WHITE':'CHESS WIZARD / BLACK')}</div>
        <div>RULESET: ${mode} · DIFFICULTY: ${difficultyName()} ${chk?' · CHECK DETECTED':''}</div>
        <div class="chess-stats"><div>WINS ${st.wins||0}</div><div>LOSSES ${st.losses||0}</div><div>CHEATS ${st.cheats||0}</div></div>
        <div class="chess-stats"><div>SHAME ${st.shame||0}</div><div>COMPLAINTS ${st.complaints||0}</div><div>CRASHES ${st.crashes||0}</div></div>
        <div>SUSPICION METER: ${suspicionLabel()} [${chess.suspicion}/100] · PHASE: ${chess.phase}</div>
        <div>MATERIAL VIBE: ${score>0?'YOU ARE RUDELY AHEAD':score<0?'CHESS WIZARD IS THRIVING':'BALANCED, ALLEGEDLY'}</div>
        <div class="chess-log">${chess.log.slice(0,8).map(x=>`<div>&gt; ${escapeHTML(x)}</div>`).join('')}</div>
        <div class="chess-history">${chess.history.length?chess.history.slice(0,6).map((x,i)=>`<div>${i+1}. ${escapeHTML(x)}</div>`).join(''):'NO MOVES LOGGED. THE BOARD IS STILL INNOCENT.'}</div>
        <div class="chess-help">ARROWS MOVE CURSOR · ENTER SELECT/MOVE · ESC QUIT<br>REAL CHECK/CHECKMATE NOW INSTALLED. CORRUPTION IS STILL A FEATURE.</div>
        <div class="chess-actions"><span class="clickable" onclick="renderSplash(); playSound(600,'sine',0.1,0.05);">[ ABANDON DIGNITY / EXIT ]</span>${chess.reviewReady?` <span class="clickable" onclick="reviewMove()">[ REVIEW MOVE ]</span>`:''}<span class="clickable" onclick="undoMove()">[ UNDO ]</span><span class="clickable" onclick="setDifficulty('easy')">[ EASY ]</span><span class="clickable" onclick="setDifficulty('normal')">[ NORMAL ]</span><span class="clickable" onclick="setDifficulty('crimes')">[ WIZARD CRIMES ]</span><span class="clickable" onclick="toggleSpeech()">[ SPEECH ${chess.speechOn?'ON':'OFF'} ]</span><span class="clickable" onclick="toggleBoops()">[ BOOPS ${chess.boopsOn?'ON':'OFF'} ]</span></div></div></div>`;
        const board = document.getElementById('chess-board');
        for (let r=0;r<8;r++) for (let c=0;c<8;c++) {
            const sq=document.createElement('div'); sq.className=`chess-square ${((r+c)%2?'dark':'light')}`;
            if (chess.cursor[0]===r && chess.cursor[1]===c) sq.classList.add('cursor');
            if (checkedKing && checkedKing[0]===r && checkedKing[1]===c) sq.classList.add('check');
            if (chess.selected && chess.selected[0]===r && chess.selected[1]===c) sq.classList.add('pick');
            if (chess.lastMove && ((chess.lastMove[0]===r&&chess.lastMove[1]===c)||(chess.lastMove[2]===r&&chess.lastMove[3]===c))) sq.classList.add('last');
            if (chess.legal.some(m=>m[0]===r&&m[1]===c)) sq.classList.add('legal');
            sq.onclick=()=>{ chess.cursor=[r,c]; chessClick(); };
            if (chess.boom && chess.boom[0]===r && chess.boom[1]===c) { const boom=document.createElement('div'); boom.className='chess-boom'; sq.appendChild(boom); }
            const pc=chess.board[r][c]; if (pc) { const d=document.createElement('div'); d.className='chess-piece'; d.dataset.fallback=glyphs[pc]||'?'; d.title=pieceNames[pc[1]]; if (chessSpriteReady) { const cv=document.createElement('canvas'); drawChessSprite(cv, pc); d.appendChild(cv); } else { document.body.classList.add('sprite-fallback'); } if(chess.lastMove && chess.lastMove[2]===r && chess.lastMove[3]===c) d.classList.add('moved'); if(chess.thinking && pc[0]==='b') d.classList.add('thinking'); sq.appendChild(d); }
            board.appendChild(sq);
        }
    }
    function reviewMove(){ chess.reviewReady=false; chessSay('SYSTEM: MOVE VERIFIED BY INTERNAL COMMITTEE. NO IRREGULARITIES FOUND.', true); achievement('UNAUTHORIZED EN PASSANT'); renderChess(); }

    function showNewGamePrompt() {
        const box = document.getElementById("system-message");
        if (!box) return;
        clearTimeout(systemMessageTimer);

        const yesClass = chess.endPromptSelection === 0 ? "clickable selected" : "clickable";
        const noClass = chess.endPromptSelection === 1 ? "clickable selected" : "clickable";

        box.innerHTML = `
            <div class="system-title">NEW GAME?</div>
            <div>&gt; CHESS WIZARD IS REQUESTING ANOTHER HIGHLY REGULATED CONTEST.</div>
            <div>&gt; SELECT YES TO RESET THE BOARD.</div>
            <div>&gt; SELECT NO TO RETURN TO SECURE VAULT ACCESS.</div>
            <div class="prompt-options">
                <span class="${yesClass}" onclick="chooseNewGamePrompt(true)">[ YES ]</span>
                <span class="${noClass}" onclick="chooseNewGamePrompt(false)">[ NO ]</span>
            </div>
            <div class="prompt-hint">ARROWS SELECT · ENTER CONFIRMS · Y/N ALSO ACCEPTED</div>
        `;
        box.style.display = "block";
    }

    function chooseNewGamePrompt(wantsNewGame) {
        playSound(wantsNewGame ? 1600 : 600, 'sine', 0.1, 0.05);
        hideSystemMessage();
        if (wantsNewGame) startChessGame();
        else renderSplash();
    }

    function handleChessEndPromptKey(e) {
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
            chess.endPromptSelection = chess.endPromptSelection ? 0 : 1;
            playSound(900, 'square', 0.025, 0.04);
            showNewGamePrompt();
            return;
        }
        if (e.key === 'Enter') {
            chooseNewGamePrompt(chess.endPromptSelection === 0);
            return;
        }
        if (String(e.key).toLowerCase() === 'y') chooseNewGamePrompt(true);
        else if (String(e.key).toLowerCase() === 'n' || e.key === 'Escape') chooseNewGamePrompt(false);
    }
    function handleChessKeyDown(e) {
        if (chess.over) { handleChessEndPromptKey(e); return; }
        if (e.key==='Escape') { renderSplash(); return; }
        if (chess.thinking) return;
        const [r,c]=chess.cursor;
        if (e.key==='ArrowUp') chess.cursor=[Math.max(0,r-1),c];
        else if (e.key==='ArrowDown') chess.cursor=[Math.min(7,r+1),c];
        else if (e.key==='ArrowLeft') chess.cursor=[r,Math.max(0,c-1)];
        else if (e.key==='ArrowRight') chess.cursor=[r,Math.min(7,c+1)];
        else if (e.key==='Enter') { chessClick(); return; }
        playSound(700+(chess.cursor[0]*70)+(chess.cursor[1]*15), 'square', 0.025, 0.035); renderChess();
    }
    function chessClick() {
        if (chess.over || chess.turn!=='w' || chess.thinking) return;
        const [r,c]=chess.cursor, pc=chess.board[r][c];
        if (!chess.selected) { if (pc && pc[0]==='w') { chess.selected=[r,c]; chess.legal=legalMoves(r,c); playSound(1300,'triangle',0.04,0.05); } renderChess(); return; }
        const [sr,sc]=chess.selected, sp=chess.board[sr][sc];
        if (sp==='wk' && sr===7 && sc===4 && r===7 && (c===6||c===2)) { chessSay('CHESS WIZARD: CASTLING HAS BEEN DEPRECATED FOR SECURITY REASONS.', true); playSound(120,'sawtooth',.18,.12); chess.selected=null; chess.legal=[]; renderChess(); return; }
        if (chess.legal.some(m=>m[0]===r&&m[1]===c)) {
            chess.undoStack.push(snapshotBoard());
            const made=makeMove(sr,sc,r,c); chess.moveCount++; chess.selected=null; chess.legal=[];
            noteMove(made); chessSay('SYSTEM: ' + made.notation, false); maybePieceFlavor(made.pc); if (Math.random()<0.18) chessSay(rand(playerAccusations), false);
            if (finishIfGameOver('b')) { renderChess(); return; }
            if (inCheck('b')) chessSay(rand(checkLines.b), true);
            chess.turn='b'; chess.thinking=true; renderChess(); const delay=650+Math.random()*900;
            setTimeout(()=>chessSay('CHESS WIZARD: '+rand(wizardThoughts), false), 120); setTimeout(computerMove, delay);
        } else { chess.selected=null; chess.legal=[]; playSound(160,'sawtooth',.1,.08); chessSay('SYSTEM: ILLEGAL MOVE BLOCKED. THE RULES ARE SHOWING OFF.', false); renderChess(); }
    }
    function maybePieceFlavor(pc){ const lines=pieceFlavor[pc?.[1]]||[]; if(lines.length && Math.random()<0.22) chessSay(rand(lines), false); }

    function rawMoves(r,c, board=chess.board) {
        const pc=board[r]?.[c]; if (!pc) return []; const color=pc[0], t=pc[1], enemy=other(color), out=[];
        const add=(rr,cc)=>{ if(rr<0||rr>7||cc<0||cc>7) return false; const q=board[rr][cc]; if(!q){out.push([rr,cc]); return true;} if(q[0]===enemy && q[1] !== 'k') out.push([rr,cc]); return false; };
        if(t==='p'){
            const dir=color==='w'?-1:1, start=color==='w'?6:1;
            if(!board[r+dir]?.[c]) { add(r+dir,c); if(r===start && !board[r+2*dir]?.[c]) add(r+2*dir,c); }
            [[r+dir,c-1],[r+dir,c+1]].forEach(([rr,cc])=>{ const q=board[rr]?.[cc]; if(q?.[0]===enemy && q[1] !== 'k') out.push([rr,cc]); });
        }
        if(t==='n') [[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]].forEach(d=>add(r+d[0],c+d[1]));
        if(t==='k') for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++) if(dr||dc) add(r+dr,c+dc);
        const rays=[]; if('rbq'.includes(t)){ if('rq'.includes(t)) rays.push([1,0],[-1,0],[0,1],[0,-1]); if('bq'.includes(t)) rays.push([1,1],[1,-1],[-1,1],[-1,-1]); rays.forEach(([dr,dc])=>{ let rr=r+dr,cc=c+dc; while(add(rr,cc)){ rr+=dr; cc+=dc; } }); }
        return out;
    }
    function findKing(color, board=chess.board){ for(let r=0;r<8;r++) for(let c=0;c<8;c++) if(board[r][c]===color+'k') return [r,c]; return null; }
    function attacksSquare(r,c,tr,tc, board=chess.board){
        const pc=board[r]?.[c]; if(!pc) return false; const color=pc[0], t=pc[1];
        const dr=tr-r, dc=tc-c, adr=Math.abs(dr), adc=Math.abs(dc);
        if(t==='p'){ const dir=color==='w'?-1:1; return tr===r+dir && adc===1; }
        if(t==='k') return Math.max(adr,adc)===1;
        if(t==='n') return (adr===1&&adc===2)||(adr===2&&adc===1);
        const straight = dr === 0 || dc === 0;
        const diagonal = adr === adc;
        const canSlide =
            (t === 'q' && (straight || diagonal)) ||
            (t === 'r' && straight) ||
            (t === 'b' && diagonal);

        if (!canSlide) return false;

        const stepR = Math.sign(dr);
        const stepC = Math.sign(dc);
        let rr = r + stepR;
        let cc = c + stepC;

        while (rr !== tr || cc !== tc) {
            if (rr < 0 || rr > 7 || cc < 0 || cc > 7) return false;
            if (board[rr][cc]) return false;
            rr += stepR;
            cc += stepC;
        }

        return true;
    }
    function isAttacked(tr,tc, byColor, board=chess.board){ for(let r=0;r<8;r++) for(let c=0;c<8;c++) if(board[r][c]?.[0]===byColor && attacksSquare(r,c,tr,tc,board)) return true; return false; }
    function inCheck(color, board=chess.board){ const k=findKing(color,board); return k ? isAttacked(k[0],k[1],other(color),board) : false; }
    function cloneBoard(board=chess.board){ return board.map(row=>row.slice()); }
    function legalMoves(r,c) {
        const pc=chess.board[r]?.[c]; if(!pc) return [];
        const color=pc[0];
        return rawMoves(r,c).filter(([rr,cc])=>{
            const b=cloneBoard(); b[rr][cc]=b[r][c]; b[r][c]='';
            if (b[rr][cc]?.[1]==='p' && (rr===0||rr===7)) b[rr][cc]=color+'q';
            return !inCheck(color,b);
        });
    }
    function allLegalMoves(color){ const a=[]; for(let r=0;r<8;r++) for(let c=0;c<8;c++) if(chess.board[r][c]?.[0]===color) legalMoves(r,c).forEach(m=>a.push([r,c,m[0],m[1],pieceScore(chess.board[m[0]][m[1]])])); return a; }
    function finishIfGameOver(sideToMove){
        const moves=allLegalMoves(sideToMove), checked=inCheck(sideToMove);
        if(moves.length) return false;
        chess.over=true;
        if(checked){
            if(sideToMove==='b'){ chessSay('SYSTEM: EXECUTIVE MONARCH TERMINATED. CHECKMATE.', true); bumpStat('wins'); achievement('KING NOT TAKEN, JUST PROFESSIONALLY CORNERED'); achievement('LORE FILES UNLOCKED'); }
            else { chessSay('CHESS WIZARD: CHECKMATE. YOUR KING HAS BEEN PLACED ON ADMINISTRATIVE LEAVE.', true); bumpStat('losses'); }
        } else { chessSay('CHESS WIZARD: WE APPEAR TO HAVE INVENTED PEACE. DISGUSTING. STALEMATE.', true); bumpStat('draws'); achievement('ACCIDENTAL DIPLOMACY'); }
        showEndRank();
        chess.endPromptSelection = 0;
        setTimeout(showNewGamePrompt, 120);
        return true;
    }
    function makeMove(r,c,rr,cc) {
        const pc=chess.board[r][c], target=chess.board[rr][cc]; let promoted = false;
        chess.board[rr][cc]=pc; chess.board[r][c]=''; chess.lastMove=[r,c,rr,cc]; chess.reviewReady=false;
        if (target) { chess.boom=[rr,cc]; setTimeout(()=>{ chess.boom=null; if(viewState==='chess') renderChess(); }, 450); }
        if (pc[1]==='p' && (rr===0||rr===7)) { chess.board[rr][cc]=pc[0]+'q'; promoted = true; chessSay('SYSTEM: PAWN PROMOTED. HR DEPARTMENT ALARMED.'); achievement('CAREER ADVANCEMENT INCIDENT'); }
        playSound(target?220:1100,target?'sawtooth':'sine',target?0.12:0.04,target?0.12:0.05);
        return { pc, target, promoted, notation: describeMove(pc,r,c,rr,cc,target,promoted) };
    }
    function chooseComputerMove() {
        const moves = allLegalMoves('b');
        if (!moves.length) return null;

        // Prefer captures, then small developing moves. This makes the opponent visibly move
        // every turn instead of only logging a bureaucratic complaint.
        moves.sort((a,b)=>{
            const captureDiff = b[4] - a[4];
            if (captureDiff) return captureDiff;
            const aAdvance = a[2] - a[0];
            const bAdvance = b[2] - b[0];
            return bAdvance - aAdvance;
        });
        return Math.random() < 0.76 ? moves[0] : rand(moves);
    }

    function computerMove() {
        if (chess.over) return;
        chess.thinking = false;

        try {
            if (finishIfGameOver('b')) { renderChess(); return; }

            const m = chooseComputerMove();
            if (!m) { finishIfGameOver('b'); renderChess(); return; }

            const made = makeMove(m[0],m[1],m[2],m[3]);
            chess.moveCount++;
            noteMove(made);
            chessSay('CHESS WIZARD: ' + made.notation, true);
            maybePieceFlavor(made.pc);

            const sass = boardScore()>3
                ? ['CHESS WIZARD: WOW. LOOK WHO READ A CHESS PAMPHLET.','CHESS WIZARD: PLEASE STOP WINNING, IT IS UNPROFESSIONAL.','SYSTEM: CHESS WIZARD HAS OPENED AN HR CASE.']
                : ['CHESS WIZARD: A PERFECTLY NORMAL MOVE, FILED IN TRIPLICATE.','CHESS WIZARD: I HAVE CALCULATED YOUR VIBES.','CHESS WIZARD: MY HORSEY HAS A DIPLOMA.'];
            chessSay(rand(sass), false);

            // Cheating is now an extra flourish after the wizard has made a real move,
            // so the player never gets two normal turns in a row by accident.
            const score = boardScore();
            let cheatChance = 0;
            if (chess.difficulty === 'easy') cheatChance = chess.corruption ? 0.10 : 0.00;
            else if (chess.difficulty === 'crimes') cheatChance = chess.corruption ? 0.62 : 0.26;
            else cheatChance = chess.corruption ? (score>2?0.42:0.24) : (chess.moveCount>10 && score>4 ? 0.14 : 0.00);
            if (!chess.over && Math.random() < cheatChance) computerCheat(false);
            if (!chess.over && chess.phase==='SUPERNATURAL' && Math.random()<0.08) { bumpStat('crashes'); chessSay('CHESS_WIZARD.EXE HAS STOPPED RESPONDING FAIRLY. RESTARTING WITH ONE EXTRA PAWN.', true); cheatExtraPawn(); achievement('SURVIVED SECRET RAGE QUIT'); }

            if (finishIfGameOver('w')) { renderChess(); return; }
            if (inCheck('w')) chessSay(rand(checkLines.w), true);

            chess.turn = 'w';
            renderChess();
        } catch (err) {
            console.error('CHESS WIZARD MOVE FAILURE', err);
            chessSay('SYSTEM: CHESS WIZARD TRIPPED OVER A CABLE. TURN RECOVERED.', false);
            chess.turn = 'w';
            chess.thinking = false;
            renderChess();
        }
    }

    function computerCheat(renderAfter = true) {
        // Non-moving cheats are allowed only as add-ons now, never as the wizard's whole turn.
        const cheats=[cheatExtraPawn, cheatTeleport, cheatStealTurn, cheatIllegalCapture, cheatTinyAdjustment, cheatTournamentWarning, cheatOpeningDoctrine];
        rand(cheats)(); bumpStat('cheats'); raiseSuspicion(18); chess.glitch=true; chess.reviewReady=true;
        if(chess.suspicion>=85) achievement('USER HAS BECOME COMBATIVE');
        if (renderAfter) renderChess();
        setTimeout(()=>{ chess.glitch=false; if(viewState==='chess') renderChess(); }, 850);
    }
    function emptySquares(){ const a=[]; for(let r=0;r<8;r++) for(let c=0;c<8;c++) if(!chess.board[r][c]) a.push([r,c]); return a; }
    function blackPieces(filter=()=>true){ const a=[]; for(let r=0;r<8;r++) for(let c=0;c<8;c++) if(chess.board[r][c]?.[0]==='b' && filter(chess.board[r][c],r,c)) a.push([r,c]); return a; }
    function whitePieces(filter=()=>true){ const a=[]; for(let r=0;r<8;r++) for(let c=0;c<8;c++) if(chess.board[r][c]?.[0]==='w' && filter(chess.board[r][c],r,c)) a.push([r,c]); return a; }
    function cheatExtraPawn(){ const e=emptySquares().filter(x=>x[0]>1&&x[0]<5); if(e.length){ const [r,c]=rand(e); chess.board[r][c]='bp'; chess.boom=[r,c]; chessSay('CHESS WIZARD: A PAWN HAS VOLUNTEERED FROM ACCOUNTING.', true); playSound(80,'square',0.2,0.15);} }
    function cheatTeleport(){ const pieces=blackPieces(pc=>pc[1]!=='k'), e=emptySquares(); if(pieces.length&&e.length){ const a=rand(pieces), b=rand(e); chess.board[b[0]][b[1]]=chess.board[a[0]][a[1]]; chess.board[a[0]][a[1]]=''; chess.lastMove=[a[0],a[1],b[0],b[1]]; chessSay('CHESS WIZARD: LEGAL NOTICE: TELEPORTATION WAS IN THE PATCH NOTES.', true); playSound(2000,'sawtooth',0.18,0.08);} }
    function cheatStealTurn(){ const moves=allLegalMoves('b'); if(moves.length){ const made = makeMove(...rand(moves).slice(0,4)); noteMove(made); chessSay('CHESS WIZARD: ' + made.notation + ' ALSO I TOOK AN EXTRA TURN. ITS CALLED INITIATIVE.', true);} }
    function cheatIllegalCapture(){ const b=blackPieces(pc=>pc[1]!=='k'), w=whitePieces(pc=>pc[1]!=='k'); if(b.length&&w.length){ const a=rand(b), victim=w.sort((x,y)=>pieceScore(chess.board[y[0]][y[1]])-pieceScore(chess.board[x[0]][x[1]]))[0]; chess.board[victim[0]][victim[1]]=chess.board[a[0]][a[1]]; chess.board[a[0]][a[1]]=''; chess.lastMove=[a[0],a[1],victim[0],victim[1]]; chess.boom=[victim[0],victim[1]]; chessSay('CHESS WIZARD: PER SECTION 4B, MY BISHOP NOW HAS CLEARANCE. ILLEGAL CAPTURE APPROVED.', true); playSound(90,'sawtooth',.25,.18);} }
    function cheatTinyAdjustment(){ const pieces=blackPieces(pc=>pc[1]!=='k'); if(!pieces.length) return cheatExtraPawn(); const a=rand(pieces), dirs=[[1,0],[0,1],[-1,0],[0,-1],[1,1],[-1,-1]]; for(const [dr,dc] of dirs.sort(()=>Math.random()-.5)){ const rr=a[0]+dr, cc=a[1]+dc; if(rr>=0&&rr<8&&cc>=0&&cc<8&&!chess.board[rr][cc]){ chess.board[rr][cc]=chess.board[a[0]][a[1]]; chess.board[a[0]][a[1]]=''; chess.lastMove=[a[0],a[1],rr,cc]; chessSay('CHESS WIZARD: JUST MOVING THIS ONE A LITTLE. DO NOT PERCEIVE ME.', true); return; } } cheatTeleport(); }
    function cheatTournamentWarning(){ chessSay('SYSTEM: WARNING. CHESS WIZARD HAS FILED A FORM 7B: OPPONENT TOO CONFIDENT.', true); playSound(55,'square',.35,.16); }
    function cheatOpeningDoctrine(){ chessSay('CHESS WIZARD: INITIATING SICILIAN-ADJACENT DEFENSE. YOUR OBJECTION HAS BEEN DENIED.', true); cheatTinyAdjustment(); }

    document.addEventListener('mousedown', resetIdle);
    renderSplash();
</script>
