<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/ico" href="/favicon.ico"/>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMC VAULT 1.48</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

        :root {
            --bright-green: #00FF41;
            --dark-green: #003B00;
            --bg-black: #050505;
            --crt-glow: 0 0 10px rgba(0, 255, 65, 0.2);
            --amber: #ffb000;
        }

        body.override {
            --bright-green: var(--amber);
            --dark-green: #5e4100;
            --crt-glow: 0 0 10px rgba(255, 176, 0, 0.2);
        }

        body {
            background-color: var(--bg-black);
            color: var(--bright-green);
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-transform: uppercase;
        }

        body::after, #image-modal::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 120;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
            will-change: auto;
        }

        .scanline {
            width: 100%;
            height: 100px;
            z-index: 121;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(0, 255, 65, 0.05) 50%, rgba(0, 0, 0, 0) 100%);
            opacity: 0.1;
            position: fixed;
            top: 0;
            left: 0;
            animation: scanline 8s linear infinite;
            pointer-events: none;
            will-change: transform;
        }

        @keyframes scanline {
            0% { transform: translateY(-100px); }
            100% { transform: translateY(100vh); }
        }

        .monitor-frame {
            padding: 25px; background: #121212; border: 12px solid #222;
            border-radius: 40px; box-shadow: inset 0 0 50px #000, 0 20px 50px rgba(0,0,0,0.8);
            position: relative; z-index: 5;
            max-width: 96vw;
            max-height: 96vh;
            box-sizing: border-box;
        }

        .crt-screen {
            width: min(850px, calc(96vw - 74px));
            height: min(550px, calc(96vh - 74px));
            min-width: 320px;
            min-height: 420px;
            background: var(--bg-black);
            position: relative; overflow: hidden; border: 15px solid #111; border-radius: 10px;
            box-sizing: border-box;
        }

        #terminal-content { padding: 15px; height: 100%; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden; }

        .system-stats {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
            border-bottom: 1px solid var(--dark-green); padding-bottom: 8px; font-size: 8.5pt; opacity: 0.8;
        }

        .path { background: var(--bright-green); color: var(--bg-black); padding: 2px 8px; margin: 10px 0; font-weight: bold; }
        
        ul { list-style: none; padding: 0; flex-grow: 1; overflow-y: auto; scroll-behavior: smooth; }
        li { padding: 4px 10px; cursor: pointer; white-space: pre; border-left: 3px solid transparent; }
        li.selected { background: var(--bright-green); color: var(--bg-black); border-left: 3px solid var(--amber); }

        .card-view { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; animation: flicker 0.15s infinite; }
        @keyframes flicker { 0% { opacity: 0.98; } 50% { opacity: 1; } 100% { opacity: 0.99; } }

        .terminal-img, #modal-img {
            border: 1px solid var(--bright-green);
            filter: contrast(1.25) brightness(1.15);
            box-shadow: var(--crt-glow);
        }

        .terminal-img {
            max-height: 250px;
            max-width: 90%;
            cursor: zoom-in !important;
        }

        #image-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.98); z-index: 110;
            justify-content: center; align-items: center; cursor: zoom-out;
            animation: flicker 0.15s infinite;
        }

        #image-modal,
        #modal-img {
            cursor: zoom-out !important;
        }

        #modal-img {
            max-width: 90%;
            max-height: 90%;
        }

        .metadata-table { width: 100%; border-collapse: collapse; font-size: 8pt; margin-top: 5px; }
        .metadata-table td {
            border: 1px solid var(--dark-green);
            padding: 4px 10px;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .glitch { animation: glitch-text 0.5s infinite; }
        @keyframes glitch-text {
            0% { text-shadow: 2px 0 red, -2px 0 blue; transform: translate(1px, 1px); }
            50% { text-shadow: -2px 0 red, 2px 0 blue; transform: translate(-1px, -1px); }
            100% { text-shadow: 2px 0 red, -2px 0 blue; transform: translate(1px, -1px); }
        }

        .clickable { cursor: pointer; padding: 2px 8px; border: 1px solid transparent; }
        .clickable:hover, .clickable.selected { background: var(--bright-green); color: var(--bg-black); }

        #system-message {
            display: none;
            position: absolute;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            width: 72%;
            padding: 12px 16px;
            background: rgba(5, 5, 5, 0.96);
            border: 1px solid var(--bright-green);
            box-shadow: var(--crt-glow);
            z-index: 130;
            font-size: 8.5pt;
            line-height: 1.5;
        }

        #system-message .system-title {
            display: inline-block;
            margin-bottom: 6px;
            padding: 1px 6px;
            background: var(--bright-green);
            color: var(--bg-black);
            font-weight: bold;
        }


        @media (max-width: 720px) {
            .monitor-frame {
                padding: 12px;
                border-width: 6px;
                border-radius: 24px;
            }

            .crt-screen {
                width: calc(100vw - 48px);
                height: calc(100vh - 48px);
                border-width: 8px;
            }

            #terminal-content {
                padding: 10px;
            }

            .system-stats {
                grid-template-columns: 1fr;
                gap: 6px;
                font-size: 7.5pt;
            }

            .terminal-img {
                max-height: 210px;
            }

            #system-message {
                position: fixed;
                width: 82%;
                bottom: 18px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .scanline,
            .card-view,
            .glitch,
            .purring,
            #image-modal {
                animation: none !important;
            }

            body::after,
            #image-modal::after {
                opacity: 0.15;
            }
        }



        /* --- Secret Chess Gremlin mini-game --- */
        .chess-wrap { display: grid; grid-template-columns: minmax(260px, 400px) 1fr; gap: 16px; height: calc(100% - 92px); min-height: 0; align-items: start; overflow: hidden; }
        #chess-board { width: min(400px, 52vh, 88vw); height: min(400px, 52vh, 88vw); display: grid; grid-template-columns: repeat(8,1fr); grid-template-rows: repeat(8,1fr); border: 2px solid var(--bright-green); box-shadow: var(--crt-glow); position: relative; overflow:hidden; transition: filter .2s, transform .2s; }
        #chess-board.cheat-glitch { animation: board-corrupt .22s steps(2,end) 8; filter: hue-rotate(40deg) saturate(2) contrast(1.4); }
        @keyframes board-corrupt { 0%{transform:translate(0,0) skew(0deg)} 25%{transform:translate(2px,-1px) skew(.5deg)} 50%{transform:translate(-2px,1px) skew(-.5deg)} 75%{transform:translate(1px,2px)} 100%{transform:translate(0,0)} }
        .chess-square { position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow:hidden; }
        .chess-square.light { background: #141414; }
        .chess-square.dark { background: #030303; }
        .chess-square.cursor { outline: 3px solid var(--amber); outline-offset: -3px; z-index:2; }
        .chess-square.pick { box-shadow: inset 0 0 0 3px var(--bright-green); }
        .chess-square.last { box-shadow: inset 0 0 14px rgba(255,176,0,.55); }
        .chess-square.legal::after { content:""; width: 14px; height:14px; border: 1px solid var(--bright-green); border-radius:50%; opacity:.85; position:absolute; }
        .chess-piece { width: 96%; height: 96%; image-rendering: pixelated; filter: drop-shadow(0 0 2px var(--bright-green)); transition: transform .18s ease, filter .18s ease; position:relative; z-index:1; display:flex; align-items:center; justify-content:center; }
        .chess-piece.moved { animation: piece-pop .22s ease; }
        .chess-piece.thinking { animation: think-wiggle .25s steps(2,end) infinite; }
        .chess-piece canvas { width:100%; height:100%; image-rendering: pixelated; }
        .chess-piece::after { content: attr(data-fallback); color: var(--bright-green); font-weight:bold; font-size: 26px; position:absolute; inset:0; display:none; align-items:center; justify-content:center; text-shadow:0 0 8px var(--bright-green); }
        body.sprite-fallback .chess-piece { border:1px solid var(--dark-green); }
        body.sprite-fallback .chess-piece::after { display:flex; }
        .chess-boom { position:absolute; inset:8%; border:2px solid var(--amber); border-radius:50%; animation: chess-boom .42s ease-out forwards; pointer-events:none; z-index:3; }
        @keyframes chess-boom { from{transform:scale(.1); opacity:1;} to{transform:scale(1.8); opacity:0;} }
        @keyframes piece-pop { 0%{transform:scale(.7)} 60%{transform:scale(1.12)} 100%{transform:scale(1)} }
        @keyframes think-wiggle { 0%,100%{transform:translateX(0)} 50%{transform:translateX(1px)} }
        .chess-panel { font-size: 8pt; line-height: 1.45; align-self: stretch; display:flex; flex-direction:column; gap:8px; overflow:hidden; }
        .chess-log { border: 1px solid var(--dark-green); padding: 8px; min-height: 108px; max-height: 176px; overflow-y:auto; background:rgba(0,0,0,.35); }
        .chess-stats { border:1px solid var(--dark-green); padding:5px 8px; display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
        .chess-help { opacity:.9; border-top:1px solid var(--dark-green); padding-top:8px; }
        @media (max-width: 720px) { .chess-wrap { grid-template-columns: 1fr; gap: 8px; overflow-y:auto; height: calc(100% - 82px); } #chess-board { width: min(82vw, 360px); height: min(82vw, 360px); justify-self:center; } .chess-panel { font-size:7pt; } }

        .keypad-grid { display: grid; grid-template-columns: repeat(3, 60px); gap: 10px; margin-top: 20px; }
        .pin-btn { 
            background: transparent; border: 1px solid var(--bright-green); 
            color: var(--bright-green); font-family: 'JetBrains Mono', monospace; 
            padding: 10px; cursor: pointer; font-size: 1.2rem;
            transition: background 0.05s, color 0.05s;
        }
        /* Hover effect still allowed, but default selection removed */
        .pin-btn:hover { background: var(--dark-green); }
        .pin-btn.active-flash { background: var(--bright-green) !important; color: #000 !important; }

        #idle-pet {
            position: absolute; bottom: 10px; right: 10px; font-size: 6pt;
            opacity: 0; transition: opacity 2s; pointer-events: none; color: var(--bright-green);
        }
        .purring { animation: purr-vibration 0.1s infinite; }
        @keyframes purr-vibration {
            0% { transform: translate(0, 0); }
            50% { transform: translate(0.5px, 0.5px); }
            100% { transform: translate(0, 0); }
        }
    
        /* Chess fit patch: prevent the board border from clipping at the bottom. */
        .chess-wrap {
            align-items: flex-start !important;
            overflow: visible !important;
        }
        .chess-board {
            width: min(43vw, 480px, calc(100vh - 300px)) !important;
            height: min(43vw, 480px, calc(100vh - 300px)) !important;
            min-width: 360px;
            min-height: 360px;
            box-sizing: border-box !important;
            flex: 0 0 auto !important;
        }
        .chess-square {
            min-width: 0;
            min-height: 0;
        }
        .chess-piece {
            width: 86% !important;
            height: 86% !important;
        }
        @media (max-height: 820px) {
            .chess-board {
                width: min(41vw, 440px, calc(100vh - 320px)) !important;
                height: min(41vw, 440px, calc(100vh - 320px)) !important;
                min-width: 320px;
                min-height: 320px;
            }
            .chess-side {
                font-size: 7.8pt !important;
            }
            .chess-log {
                max-height: 170px !important;
            }
        }

    </style>
</head>
<body onkeydown="handleKeyDown(event)">

<div id="image-modal" onclick="closeModal()">
    <img id="modal-img" src="" alt="Enlarged View">
</div>

<div id="idle-pet">
    <pre>
      |\      _,,,---,,_
ZZZzz /,`.-'`'    -.  ;-;;,_
     |,4-  ) )-,_. ,\ (  `'-'
    '---''(_/--'  `-'\_)
    </pre>
</div>

<div class="scanline"></div>

<div class="monitor-frame">
    <div class="crt-screen" id="crt-screen">
        <div id="terminal-content">
            <!-- Initial Splash Logic will be injected here via renderSplash -->
        </div>
        <div id="system-message" role="status" aria-live="polite"></div>
    </div>
</div>

<script src="database.js"></script>
<script>
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    let purrOsc, purrGain;
    const konamiCode = ["ArrowUp", "ArrowUp", "ArrowDown", "ArrowDown", "ArrowLeft", "ArrowRight", "ArrowLeft", "ArrowRight", "b", "a"];
    let konamiIndex = 0;
    let idleTimer, sessionTimeout;
    let systemMessageTimer;

    function showSystemMessage(title, lines = [], duration = 4500) {
        const box = document.getElementById("system-message");
        if (!box) return;

        clearTimeout(systemMessageTimer);

        box.innerHTML = `
            <div class="system-title">${title}</div>
            ${lines.map(line => `<div>&gt; ${line}</div>`).join("")}
        `;

        box.style.display = "block";

        systemMessageTimer = setTimeout(() => {
            box.style.display = "none";
        }, duration);
    }

    function showSaveHelp(event, url) {
        if (event) {
            event.preventDefault();
            event.stopPropagation();
        }

        playSound(900, "sine", 0.08, 0.04);

        showSystemMessage("SAVE IMAGE HELP", [
            "DIRECT DOWNLOAD IS BLOCKED BY THE IMAGE HOST",
            "RIGHT-CLICK THE IMAGE",
            "SELECT SAVE IMAGE AS",
            "EXPECTED FILE FORMAT: WEBP"
        ]);
    }




    const terminal = document.getElementById('terminal-content');

    function escapeHTML(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function escapeJS(value) {
        return String(value ?? "")
            .replace(/\\/g, "\\\\")
            .replace(/'/g, "\\'")
            .replace(/\n/g, "\\n")
            .replace(/\r/g, "\\r");
    }

    function getDatabase() {
        return window.database || (typeof database !== "undefined" ? database : null);
    }

    function databaseReady() {
        const db = getDatabase();
        return db && typeof db === "object";
    }

    function renderDatabaseError() {
        viewState = "error";
        selectedIndex = 0;
        terminal.innerHTML = getHeader() + `
            <div class="path">A:\\SYSTEM\\ERROR</div>
            <div class="card-view">
                <p class="glitch">DATABASE.JS NOT FOUND OR FAILED TO LOAD</p>
                <p>PLACE DATABASE.JS IN THE SAME FOLDER AS THIS HTML FILE</p>
                <p class="clickable" onclick="location.reload()">[ RETRY ]</p>
            </div>
        `;
        refreshSelectableItems();
        updateSelection();
    }

    let inputBuffer = "";
    const CORRECT_PIN_HASH = "b20a51d1d0cd4d4e2f5c6f6b9939e8a4d4db0fb202efc513a8e1cddf9021bf4e";
    const SECRET_PIN_HASH = "4dea5c7cb70f50322ec9d734aa4aa078be9227c05251e18991c596f387552370";
    const CHESS_PIN_HASH = "3a0e14026c6b1d6b4cae899e451e9ebcbd9646c44a956440f2227b2212447be6"; // PIN 2600
    let isSecretAccess = false;

    async function sha256(text) {
        const data = new TextEncoder().encode(text);
        const hashBuffer = await crypto.subtle.digest("SHA-256", data);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2,"0")).join("");
    }
    let selectedIndex = 0;
    let viewState = "splash";
    let currentFolderName = "";
    let currentSubFolder = "";
    let currentFileIndex = 0;
    let folderSelections = {};
    let navigationMode = "mouse";

    function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }

    function playSound(freq, type, dur, vol) {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    function startPurr() {
        initAudio();
        purrOsc = audioCtx.createOscillator();
        const lfo = audioCtx.createOscillator();
        purrGain = audioCtx.createGain();
        const lfoGain = audioCtx.createGain();
        purrOsc.type = 'sawtooth'; purrOsc.frequency.setValueAtTime(25, audioCtx.currentTime);
        lfo.frequency.setValueAtTime(2, audioCtx.currentTime);
        lfoGain.gain.setValueAtTime(0.005, audioCtx.currentTime);
        lfo.connect(lfoGain); lfoGain.connect(purrGain.gain);
        purrGain.gain.setValueAtTime(0.01, audioCtx.currentTime);
        purrOsc.connect(purrGain); purrGain.connect(audioCtx.destination);
        purrOsc.start(); lfo.start();
        document.getElementById('idle-pet').classList.add('purring');
    }

    function stopPurr() {
        if (purrOsc) { try { purrOsc.stop(); purrOsc.disconnect(); } catch(e){} }
        document.getElementById('idle-pet').classList.remove('purring');
    }

    function resetIdle() {
        const pet = document.getElementById('idle-pet');
        pet.style.opacity = "0"; stopPurr();
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => { pet.style.opacity = "0.6"; startPurr(); }, 20000);

        // Security Auto-Lock (3 Minutes) - Returns to Splash Screen
        clearTimeout(sessionTimeout);
        if (viewState !== "splash") {
            sessionTimeout = setTimeout(() => {
                playSound(150, 'sawtooth', 0.5, 0.2);
                renderSplash();
            }, 180000); 
        }
    }

    function getHeader() {
        return `
            <div class="system-stats">
                <div>CPU [|||||| 42%] <br> MEM [||| 1.2GB/8GB]</div>
                <div style="text-align: right">USER: ${isSecretAccess ? "ROOT" : "GUEST"}<br>TIME: ${new Date().toLocaleTimeString()}</div>
            </div>
        `;
    }


    function navigateModalGallery(direction) {
        const db = getDatabase();
        if (!db) return renderDatabaseError();

        const files = currentSubFolder ? db[currentFolderName][currentSubFolder] : db[currentFolderName];
        if (!files || !files.length) return renderDatabaseError();

        currentFileIndex = (currentFileIndex + direction + files.length) % files.length;
        const selectionKey = `${currentFolderName}::${currentSubFolder}`;
        folderSelections[selectionKey] = currentFileIndex + 1;

        const card = files[currentFileIndex];
        const modalImg = document.getElementById("modal-img");
        modalImg.src = card.file;
        modalImg.alt = card.caption || `${card.title}.IMG`;

        playSound(1500, "sine", 0.05, 0.04);
    }

    function handleKeyDown(e) {
        navigationMode = "keyboard";
        resetIdle();

        if (e.key === konamiCode[konamiIndex]) {
            konamiIndex++;
            if (konamiIndex === konamiCode.length) {
                document.body.classList.toggle('override');
                playSound(2000, 'sine', 0.2, 0.1);
                konamiIndex = 0;
            }
        } else { konamiIndex = 0; }

        if (viewState === "chess") { handleChessKeyDown(e); return; }

        if (document.getElementById('image-modal').style.display === 'flex') {
            if (e.key === "Escape" || e.key === "Enter") closeModal();
            else if (e.key === "ArrowRight") {
                navigateModalGallery(1);
            } else if (e.key === "ArrowLeft") {
                navigateModalGallery(-1);
            }
            return;
        }

        if (viewState === "splash") { playSound(800, 'sine', 0.05, 0.1); bootSystem(); return; }

        const items = terminal.querySelectorAll('li, .pin-btn, .clickable');
        
        if (e.key === "ArrowDown") {
            selectedIndex = (selectedIndex + 1) % items.length;
            playSound(1200, 'sine', 0.01, 0.05);
            updateSelection();
        } else if (e.key === "ArrowUp") {
            selectedIndex = (selectedIndex - 1 + items.length) % items.length;
            playSound(1200, 'sine', 0.01, 0.05);
            updateSelection();
        } else if (e.key === "Enter" && items[selectedIndex]) {
            items[selectedIndex].click();
        } else if (e.key === "Escape") {
            playSound(600, 'sine', 0.1, 0.05);
            if (viewState === "root") renderSplash();
            else if (viewState === "dir" && currentSubFolder) openDir(currentFolderName);
            else if (viewState === "dir") renderRoot();
            else if (viewState === "file") openDir(currentFolderName, true, currentSubFolder);
        } else if (viewState === "file" && e.key === "ArrowRight") navigateGallery(1);
        else if (viewState === "file" && e.key === "ArrowLeft") navigateGallery(-1);
        else if (!isNaN(e.key) && viewState === "pin") pressKey(e.key);
    }

    function refreshSelectableItems() {
        const items = terminal.querySelectorAll('li, .pin-btn, .clickable');
        items.forEach((item, idx) => {
            item.addEventListener("mouseenter", () => {
                if (navigationMode !== "mouse") return;

                selectedIndex = idx;
                updateSelection();
            });
            item.addEventListener("mousemove", () => {
                navigationMode = "mouse";
            });
            item.addEventListener("click", () => {
                navigationMode = "mouse";
                selectedIndex = idx;
                updateSelection();
            });
        });
    }

    function updateSelection() {
        const items = terminal.querySelectorAll('li, .pin-btn, .clickable');
        items.forEach((item, idx) => {
            const isSelected = idx === selectedIndex;
            item.classList.toggle('selected', isSelected);
            if (isSelected && (viewState === "dir" || viewState === "root")) {
                item.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        });
    }

    function renderSplash() {
        viewState = "splash";
        terminal.innerHTML = `
            <div class="card-view" onclick="bootSystem()">
                <pre class="glitch" style="font-size: 8pt; line-height: 1;">
 ██████╗███╗   ███╗ ██████╗ 
██╔════╝████╗ ████║██╔════╝

        const m = Math.random()<0.7 ? moves[0] : moves[Math.floor(Math.random()*moves.length)];
        const made = makeMove(m[0],m[1],m[2],m[3]);
        chessSay('CHESS WIZARD: ' + made.notation, true);
        const sass = boardScore()>3 ? ['CHESS WIZARD: WOW. LOOK WHO READ A CHESS PAMPHLET.','CHESS WIZARD: PLEASE STOP WINNING, IT IS UNPROFESSIONAL.','CHESS WIZARD: YOUR MATERIAL ADVANTAGE HAS BEEN REPORTED.'] : ['CHESS WIZARD: A PERFECTLY NORMAL MOVE, FILED IN TRIPLICATE.','CHESS WIZARD: I HAVE CALCULATED YOUR VIBES.','CHESS WIZARD: MY HORSEY HAS A DIPLOMA.'];
        chessSay(sass[Math.floor(Math.random()*sass.length)], false);
        chess.turn='w'; renderChess();
    }
    function computerCheat() {
        const cheats=[cheatExtraPawn, cheatTeleport, cheatStealTurn, cheatIllegalCapture, cheatTinyAdjustment, cheatTournamentWarning];
        cheats[Math.floor(Math.random()*cheats.length)](); bumpStat('cheats'); chess.turn='w'; chess.glitch=true; renderChess(); setTimeout(()=>{ chess.glitch=false; if(viewState==='chess') renderChess(); }, 850);
    }
    function emptySquares(){ const a=[]; for(let r=0;r<8;r++) for(let c=0;c<8;c++) if(!chess.board[r][c]) a.push([r,c]); return a; }
    function blackPieces(filter=()=>true){ const a=[]; for(let r=0;r<8;r++) for(let c=0;c<8;c++) if(chess.board[r][c]?.[0]==='b' && filter(chess.board[r][c],r,c)) a.push([r,c]); return a; }
    function whitePieces(filter=()=>true){ const a=[]; for(let r=0;r<8;r++) for(let c=0;c<8;c++) if(chess.board[r][c]?.[0]==='w' && filter(chess.board[r][c],r,c)) a.push([r,c]); return a; }
    function cheatExtraPawn(){ const e=emptySquares().filter(x=>x[0]>1&&x[0]<5); if(e.length){ const [r,c]=e[Math.floor(Math.random()*e.length)]; chess.board[r][c]='bp'; chess.boom=[r,c]; chessSay('CHESS WIZARD: A PAWN HAS VOLUNTEERED FROM ACCOUNTING.', true); playSound(80,'square',0.2,0.15);} }
    function cheatTeleport(){ const pieces=blackPieces(pc=>pc[1]!=='k'), e=emptySquares(); if(pieces.length&&e.length){ const a=pieces[Math.floor(Math.random()*pieces.length)], b=e[Math.floor(Math.random()*e.length)]; chess.board[b[0]][b[1]]=chess.board[a[0]][a[1]]; chess.board[a[0]][a[1]]=''; chess.lastMove=[a[0],a[1],b[0],b[1]]; chessSay('CHESS WIZARD: LEGAL NOTICE: TELEPORTATION WAS IN THE PATCH NOTES.', true); playSound(2000,'sawtooth',0.18,0.08);} }
    function cheatStealTurn(){ const moves=[]; for(let r=0;r<8;r++) for(let c=0;c<8;c++) if(chess.board[r][c]?.[0]==='b') legalMoves(r,c).forEach(m=>moves.push([r,c,m[0],m[1]])); if(moves.length){ const made = makeMove(...moves[Math.floor(Math.random()*moves.length)]); chessSay('CHESS WIZARD: ' + made.notation + ' ALSO I TOOK AN EXTRA TURN. ITS CALLED INITIATIVE.', true);} }
    function cheatIllegalCapture(){ const b=blackPieces(pc=>pc[1]!=='k'), w=whitePieces(pc=>pc[1]!=='k'); if(b.length&&w.length){ const a=b[Math.floor(Math.random()*b.length)], victim=w.sort((x,y)=>pieceScore(chess.board[y[0]][y[1]])-pieceScore(chess.board[x[0]][x[1]]))[0]; chess.board[victim[0]][victim[1]]=chess.board[a[0]][a[1]]; chess.board[a[0]][a[1]]=''; chess.lastMove=[a[0],a[1],victim[0],victim[1]]; chess.boom=[victim[0],victim[1]]; chessSay('CHESS WIZARD: ILLEGAL CAPTURE? I DONT THINK SO.', true); playSound(90,'sawtooth',.25,.18);} }
    function cheatTinyAdjustment(){ const pieces=blackPieces(pc=>pc[1]!=='k'); if(!pieces.length) return cheatExtraPawn(); const a=pieces[Math.floor(Math.random()*pieces.length)], dirs=[[1,0],[0,1],[-1,0],[0,-1],[1,1],[-1,-1]]; for(const [dr,dc] of dirs.sort(()=>Math.random()-.5)){ const rr=a[0]+dr, cc=a[1]+dc; if(rr>=0&&rr<8&&cc>=0&&cc<8&&!chess.board[rr][cc]){ chess.board[rr][cc]=chess.board[a[0]][a[1]]; chess.board[a[0]][a[1]]=''; chess.lastMove=[a[0],a[1],rr,cc]; chessSay('CHESS WIZARD: JUST MOVING THIS ONE A LITTLE. DO NOT PERCEIVE ME.', true); return; } } cheatTeleport(); }
    function cheatTournamentWarning(){ chessSay('SYSTEM: WARNING. CHESS WIZARD HAS FILED A FORM 7B: OPPONENT TOO CONFIDENT.', true); playSound(55,'square',.35,.16); }

    document.addEventListener('mousedown', resetIdle);
    renderSplash();
</script>
