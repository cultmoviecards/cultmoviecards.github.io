        :root {

            --dark-green: #003B00;
            --bg-black: #050505;
            --crt-glow: 0 0 10px rgba(0, 255, 65, 0.2);
        }

        body {
            background-color: var(--bg-black);
            color: var(--bright-green);
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-transform: uppercase;
        }

        /* CRT Scanline and Flicker Effects */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 20;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        .scanline {
            width: 100%; height: 100px; z-index: 21;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(0, 255, 65, 0.05) 50%, rgba(0, 0, 0, 0) 100%);
            opacity: 0.1; position: absolute; bottom: 100%;
            animation: scanline 8s linear infinite;
        }

        @keyframes scanline { 0% { top: 0%; } 100% { top: 100%; } }

        .monitor-frame {
            padding: 25px;
            background: #121212;
            border: 12px solid #222;
            border-radius: 40px;
            box-shadow: inset 0 0 50px #000, 0 20px 50px rgba(0,0,0,0.8);
            position: relative;
            z-index: 5;
        }

        .crt-screen {
            width: 850px;
            height: 550px;
            background: var(--bg-black);
            position: relative;
            overflow: hidden;
            border: 15px solid #111;
            border-radius: 10px;
        }

        #terminal-content {
            padding: 15px;
            height: 100%;
            box-sizing: border-box;
            font-size: 10.5pt; 
            line-height: 1.3;
            display: flex;
            flex-direction: column;
        }

        .system-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            border-bottom: 1px solid var(--dark-green);
            padding-bottom: 8px;
            margin-bottom: 10px;
            font-size: 8.5pt;
            opacity: 0.8;
        }

        .path { 
            background: var(--bright-green); 
            color: var(--bg-black); 
            padding: 2px 8px; 
            margin-bottom: 10px; 
            font-weight: bold;
        }
        
        ul { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex-grow: 1; }
        li { padding: 2px 10px; white-space: pre; cursor: pointer; }
        li.selected { background: var(--bright-green); color: var(--bg-black); box-shadow: var(--crt-glow); }

        .keypad-grid {
            display: grid; 
            grid-template-columns: repeat(3, 50px); 
            gap: 8px; 
            margin-top: 15px;
        }

        .pin-btn {
            background: transparent;
            border: 1px solid var(--bright-green);
            color: var(--bright-green);
            font-family: 'JetBrains Mono', monospace;
            padding: 10px;
            cursor: pointer;
        }

        .pin-btn.selected { background: var(--bright-green); color: #000; }

        .card-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.98; } 50% { opacity: 1; } 100% { opacity: 0.99; }
        }

        .terminal-img {
            max-height: 280px;
            max-width: 90%;
            border: 1px solid var(--bright-green);
            filter: none(1) hue-rotate(90deg) contrast(1.4) brightness(0.9);
            margin-bottom: 10px;
            box-shadow: var(--crt-glow);
        }

        .metadata-table { width: 100%; border-collapse: collapse; font-size: 9pt; }
        .metadata-table td { border: 1px solid var(--dark-green); padding: 4px 10px; }

        .glitch { animation: glitch-text 0.5s infinite; }
        @keyframes glitch-text {
            0% { text-shadow: 2px 0 red, -2px 0 blue; }
            50% { text-shadow: -2px 0 red, 2px 0 blue; }
            100% { text-shadow: 2px 0 red, -2px 0 blue; }
        }

        .clickable { cursor: pointer; padding: 2px 5px; }
        .clickable:hover, .clickable.selected { background: var(--bright-green); color: var(--bg-black); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--dark-green); }
    </style>
</head>

        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);

    const terminal = document.getElementById('terminal-content');
    let inputBuffer = "";
    const CORRECT_PIN = "2038";
    let selectedIndex = 0;
    let viewState = "boot";
    let currentFolderName = "";
    let currentFileIndex = 0;

    function getHeader() {
        const now = new Date();
        const timeStr = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0') + ":" + now.getSeconds().toString().padStart(2, '0');
        return `
            <div class="system-stats">
                <div>
                    CPU [<span style="color:white">||||||</span> 42%] <br>
                    MEM [<span style="color:white">|||</span> 1.2GB/8GB]
                </div>
                <div style="text-align: right">
                    USER: AUTH_GUEST<br>
                    TIME: ${timeStr}
                </div>
            </div>
        `;
    }

    function updateSelection() {
        const items = terminal.querySelectorAll('li, .pin-btn, .clickable');
        items.forEach((item, idx) => {
            item.classList.toggle('selected', idx === selectedIndex);
            if (idx === selectedIndex) item.scrollIntoView({ block: "nearest" });
        });
        playSound(800, 'square', 0.02, 0.05);
    }

    function handleKeyDown(e) {
        if (viewState === "boot") { bootSystem(); return; }

        const items = terminal.querySelectorAll('li, .pin-btn, .clickable');
        
        if (e.key === "ArrowDown") {
            selectedIndex = (selectedIndex + 1) % items.length;
            updateSelection();
        } else if (e.key === "ArrowUp") {
            selectedIndex = (selectedIndex - 1 + items.length) % items.length;
            updateSelection();
        } else if (e.key === "ArrowRight" && viewState === "file") {
            const nextIdx = (currentFileIndex + 1) % database[currentFolderName].length;
            viewCard(currentFolderName, nextIdx);
        } else if (e.key === "ArrowLeft" && viewState === "file") {
            const prevIdx = (currentFileIndex - 1 + database[currentFolderName].length) % database[currentFolderName].length;
            viewCard(currentFolderName, prevIdx);
        } else if (e.key === "Enter") {
            if (items[selectedIndex]) items[selectedIndex].click();
        } else if (e.key === "Escape") {
            if (viewState === "dir") renderRoot();
            else if (viewState === "file") openDir(currentFolderName);
        } else if (!isNaN(e.key) && viewState === "pin") {
            pressKey(e.key);
        }
    }

    function bootSystem() {
        showLoginPrompt();
    }

    function showLoginPrompt() {
        viewState = "pin";
        inputBuffer = "";
        playSound(440, 'sine', 0.1, 0.1);
        terminal.innerHTML = getHeader() + `
            <div class="card-view">
                <p class="glitch">AUTHORIZATION REQUIRED</p>
                <h2 id="pin-display" style="letter-spacing: 12px; color: #fff; border: 1px solid var(--dark-green); padding: 10px;">____</h2>

                    <button class="pin-btn" onclick="pressKey('0')">0</button>
                    <button class="pin-btn" onclick="verifyPin()">ENT</button>
                </div>
            </div>
        `;
        selectedIndex = -1;
    }

    function pressKey(num) {
        if (inputBuffer.length < 4) {
            inputBuffer += num;
            document.getElementById('pin-display').innerText = inputBuffer.padEnd(4, "_");
            playSound(1200, 'triangle', 0.02, 0.1);
        }
        if (inputBuffer.length === 4) setTimeout(verifyPin, 250);
    }

    function resetPin() {
        inputBuffer = "";
        document.getElementById('pin-display').innerText = "____";
        playSound(200, 'sawtooth', 0.1, 0.1);
    }

    function verifyPin() {
        const status = document.getElementById('auth-status');
        if (inputBuffer === CORRECT_PIN) {
            playSound(1000, 'sine', 0.4, 0.1);
            status.style.color = "var(--bright-green)";
            status.innerText = "ACCESS GRANTED - DECRYPTING...";
            setTimeout(renderRoot, 800);

            status.innerText = "INVALID ACCESS CODE";
            inputBuffer = "";
            document.getElementById('pin-display').innerText = "____";
        }
    }

    function renderRoot() {
        viewState = "root";
        selectedIndex = 0;
        let html = getHeader() + `<div class="path">A:\ROOT</div><ul>`;
        for (let folder in database) {
            html += `<li onclick="openDir('${folder}')">drwxr-xr-x   [DIR]  ${folder.toUpperCase()}</li>`;

        html += `</ul><p style="font-size:8pt; opacity:0.5; padding:10px;">TOTAL FOLDERS: ${Object.keys(database).length}</p>`;
        terminal.innerHTML = html;
        updateSelection();
    }

    function openDir(name) {
        viewState = "dir";
        selectedIndex = 1;
        currentFolderName = name;
        let html = getHeader() + `<div class="path">A:\\${name.toUpperCase()}</div><ul>`;

        terminal.innerHTML = html + `</ul>`;
        updateSelection();
    }

        setTimeout(() => {
            terminal.innerHTML = getHeader() + `
                <div class="path">A:\\${dir.toUpperCase()}\\${card.title}.IMG</div>
                <div class="card-view">
                    <img src="${card.file}" class="terminal-img" onerror="this.src='https://via.placeholder.com/400x300/050505/00FF41?text=SIGNAL_LOST'">
                    
                    <div style="display: flex; gap: 30px; margin-bottom: 10px;">
                        <span class="clickable" onclick="viewCard('${dir}', ${prevIdx})">[ PREVIOUS ]</span>
                        <span style="color: var(--dark-green)">|</span>
                        <span class="clickable" onclick="viewCard('${dir}', ${nextIdx})">[ NEXT ]</span>
                    </div>

                    <table class="metadata-table">
                        <tr><td>REF_ID</td><td>${card.id}</td><td>INDEX</td><td>${idx + 1} / ${folder.length}</td></tr>
                        <tr><td>DATA</td><td colspan="3">${card.caption}</td></tr>
                    </table>
                    
                    <p class="clickable selected" style="margin-top:15px; border:1px solid; padding:5px 20px;" onclick="openDir('${dir}')">[ ESC: RETURN TO LIST ]</p>
                </div>
            `;
            // Focus the "Return" button by default
            selectedIndex = 2; // Index of the Return button in the .clickable list
        }, 300);
    }
</script>

</body>
</html>
