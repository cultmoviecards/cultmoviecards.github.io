<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/ico" href="/favicon.ico"/>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMC VAULT 1.23</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

        :root {
            --bright-green: #00FF41;
            --dark-green: #003B00;
            --bg-black: #050505;
            --crt-glow: 0 0 10px rgba(0, 255, 65, 0.2);
            --amber: #ffb000;
        }

        body.override {
            --bright-green: var(--amber);
            --dark-green: #5e4100;
            --crt-glow: 0 0 10px rgba(255, 176, 0, 0.2);
        }

        body {
            background-color: var(--bg-black);
            color: var(--bright-green);
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-transform: uppercase;
        }

        body::after, #image-modal::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 120;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
            will-change: auto;
        }

        .scanline {
            width: 100%;
            height: 100px;
            z-index: 121;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(0, 255, 65, 0.05) 50%, rgba(0, 0, 0, 0) 100%);
            opacity: 0.1;
            position: fixed;
            top: 0;
            left: 0;
            animation: scanline 8s linear infinite;
            pointer-events: none;
            will-change: transform;
        }

        @keyframes scanline {
            0% { transform: translateY(-100px); }
            100% { transform: translateY(100vh); }
        }

        .monitor-frame {
            padding: 25px; background: #121212; border: 12px solid #222;
            border-radius: 40px; box-shadow: inset 0 0 50px #000, 0 20px 50px rgba(0,0,0,0.8);
            position: relative; z-index: 5;
            max-width: 96vw;
            max-height: 96vh;
            box-sizing: border-box;
        }

        .crt-screen {
            width: min(850px, calc(96vw - 74px));
            height: min(550px, calc(96vh - 74px));
            min-width: 320px;
            min-height: 420px;
            background: var(--bg-black);
            position: relative; overflow: hidden; border: 15px solid #111; border-radius: 10px;
            box-sizing: border-box;
        }

        #terminal-content { padding: 15px; height: 100%; display: flex; flex-direction: column; }

        .system-stats {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
            border-bottom: 1px solid var(--dark-green); padding-bottom: 8px; font-size: 8.5pt; opacity: 0.8;
        }

        .path { background: var(--bright-green); color: var(--bg-black); padding: 2px 8px; margin: 10px 0; font-weight: bold; }
        
        ul { list-style: none; padding: 0; flex-grow: 1; overflow-y: auto; scroll-behavior: smooth; }
        li { padding: 4px 10px; cursor: pointer; white-space: pre; border-left: 3px solid transparent; }
        li.selected { background: var(--bright-green); color: var(--bg-black); border-left: 3px solid var(--amber); }

        .card-view { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; animation: flicker 0.15s infinite; }
        @keyframes flicker { 0% { opacity: 0.98; } 50% { opacity: 1; } 100% { opacity: 0.99; } }

        .terminal-img, #modal-img {
            border: 1px solid var(--bright-green);
            filter: contrast(1.4) brightness(0.9);
            box-shadow: var(--crt-glow);
        }

        .terminal-img {
            max-height: 250px;
            max-width: 90%;
            cursor: zoom-in !important;
        }

        #image-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.98); z-index: 110;
            justify-content: center; align-items: center; cursor: zoom-out;
            animation: flicker 0.15s infinite;
        }

        #image-modal,
        #modal-img {
            cursor: zoom-out !important;
        }

        #modal-img {
            max-width: 90%;
            max-height: 90%;
        }

        .metadata-table { width: 100%; border-collapse: collapse; font-size: 8pt; margin-top: 5px; }
        .metadata-table td { border: 1px solid var(--dark-green); padding: 4px 10px; }

        .glitch { animation: glitch-text 0.5s infinite; }
        @keyframes glitch-text {
            0% { text-shadow: 2px 0 red, -2px 0 blue; transform: translate(1px, 1px); }
            50% { text-shadow: -2px 0 red, 2px 0 blue; transform: translate(-1px, -1px); }
            100% { text-shadow: 2px 0 red, -2px 0 blue; transform: translate(1px, -1px); }
        }

        .clickable { cursor: pointer; padding: 2px 8px; border: 1px solid transparent; }
        .clickable:hover, .clickable.selected { background: var(--bright-green); color: var(--bg-black); }

        #system-message {
            display: none;
            position: absolute;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            width: 72%;
            padding: 12px 16px;
            background: rgba(5, 5, 5, 0.96);
            border: 1px solid var(--bright-green);
            box-shadow: var(--crt-glow);
            z-index: 130;
            font-size: 8.5pt;
            line-height: 1.5;
        }

        #system-message .system-title {
            display: inline-block;
            margin-bottom: 6px;
            padding: 1px 6px;
            background: var(--bright-green);
            color: var(--bg-black);
            font-weight: bold;
        }


        @media (max-width: 720px) {
            .monitor-frame {
                padding: 12px;
                border-width: 6px;
                border-radius: 24px;
            }

            .crt-screen {
                width: calc(100vw - 48px);
                height: calc(100vh - 48px);
                border-width: 8px;
            }

            #terminal-content {
                padding: 10px;
            }

            .system-stats {
                grid-template-columns: 1fr;
                gap: 6px;
                font-size: 7.5pt;
            }

            .terminal-img {
                max-height: 210px;
            }

            #system-message {
                width: 82%;
                bottom: 18px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .scanline,
            .card-view,
            .glitch,
            .purring,
            #image-modal {
                animation: none !important;
            }

            body::after,
            #image-modal::after {
                opacity: 0.15;
            }
        }

        .keypad-grid { display: grid; grid-template-columns: repeat(3, 60px); gap: 10px; margin-top: 20px; }
        .pin-btn { 
            background: transparent; border: 1px solid var(--bright-green); 
            color: var(--bright-green); font-family: 'JetBrains Mono', monospace; 
            padding: 10px; cursor: pointer; font-size: 1.2rem;
            transition: background 0.05s, color 0.05s;
        }
        /* Hover effect still allowed, but default selection removed */
        .pin-btn:hover { background: var(--dark-green); }
        .pin-btn.active-flash { background: var(--bright-green) !important; color: #000 !important; }

        #idle-pet {
            position: absolute; bottom: 10px; right: 10px; font-size: 6pt;
            opacity: 0; transition: opacity 2s; pointer-events: none; color: var(--bright-green);
        }
        .purring { animation: purr-vibration 0.1s infinite; }
        @keyframes purr-vibration {
            0% { transform: translate(0, 0); }
            50% { transform: translate(0.5px, 0.5px); }
            100% { transform: translate(0, 0); }
        }
    </style>
</head>
<body onkeydown="handleKeyDown(event)">

<div id="image-modal" onclick="closeModal()">
    <img id="modal-img" src="" alt="Enlarged View">
</div>

<div id="idle-pet">
    <pre>
      |\      _,,,---,,_
ZZZzz /,`.-'`'    -.  ;-;;,_
     |,4-  ) )-,_. ,\ (  `'-'
    '---''(_/--'  `-'\_)
    </pre>
</div>

<div class="scanline"></div>

<div class="monitor-frame">
    <div class="crt-screen" id="crt-screen">
        <div id="terminal-content">
            <!-- Initial Splash Logic will be injected here via renderSplash -->
        </div>
        <div id="system-message" role="status" aria-live="polite"></div>
    </div>
</div>

<script src="database.js"></script>
<script>
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    let purrOsc, purrGain;
    const konamiCode = ["ArrowUp", "ArrowUp", "ArrowDown", "ArrowDown", "ArrowLeft", "ArrowRight", "ArrowLeft", "ArrowRight", "b", "a"];
    let konamiIndex = 0;
    let idleTimer, sessionTimeout;
    let systemMessageTimer;

    function showSystemMessage(title, lines = [], duration = 4500) {
        const box = document.getElementById("system-message");
        if (!box) return;

        clearTimeout(systemMessageTimer);

        box.innerHTML = `
            <div class="system-title">${title}</div>
            ${lines.map(line => `<div>&gt; ${line}</div>`).join("")}
        `;

        box.style.display = "block";

        systemMessageTimer = setTimeout(() => {
            box.style.display = "none";
        }, duration);
    }

    function showSaveHelp(event, url) {
        if (event) {
            event.preventDefault();
            event.stopPropagation();
        }

        playSound(900, "sine", 0.08, 0.04);

        showSystemMessage("SAVE IMAGE HELP", [
            "DIRECT DOWNLOAD IS BLOCKED BY THE IMAGE HOST",
            "RIGHT-CLICK THE IMAGE",
            "SELECT SAVE IMAGE AS",
            "EXPECTED FILE FORMAT: WEBP"
        ]);
    }




    const terminal = document.getElementById('terminal-content');

    function escapeHTML(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function escapeJS(value) {
        return String(value ?? "")
            .replace(/\\/g, "\\\\")
            .replace(/'/g, "\\'")
            .replace(/\n/g, "\\n")
            .replace(/\r/g, "\\r");
    }

    function getDatabase() {
        return window.database || (typeof database !== "undefined" ? database : null);
    }

    function databaseReady() {
        const db = getDatabase();
        return db && typeof db === "object";
    }

    function renderDatabaseError() {
        viewState = "error";
        terminal.innerHTML = getHeader() + `
            <div class="path">A:\\SYSTEM\\ERROR</div>
            <div class="card-view">
                <p class="glitch">DATABASE.JS NOT FOUND OR FAILED TO LOAD</p>
                <p>PLACE DATABASE.JS IN THE SAME FOLDER AS THIS HTML FILE</p>
                <p class="clickable" onclick="location.reload()">[ RETRY ]</p>
            </div>
        `;
    }

    let inputBuffer = "";
    const CORRECT_PIN_HASH = "b20a51d1d0cd4d4e2f5c6f6b9939e8a4d4db0fb202efc513a8e1cddf9021bf4e";
    const SECRET_PIN_HASH = "4dea5c7cb70f50322ec9d734aa4aa078be9227c05251e18991c596f387552370";
    let isSecretAccess = false;

    async function sha256(text) {
        const data = new TextEncoder().encode(text);
        const hashBuffer = await crypto.subtle.digest("SHA-256", data);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2,"0")).join("");
    }
    let selectedIndex = 0;
    let viewState = "splash";
    let currentFolderName = "";
    let currentSubFolder = "";
    let currentFileIndex = 0;
    let lastFileSelectionIndex = 1;

    function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }

    function playSound(freq, type, dur, vol) {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    function startPurr() {
        initAudio();
        purrOsc = audioCtx.createOscillator();
        const lfo = audioCtx.createOscillator();
        purrGain = audioCtx.createGain();
        const lfoGain = audioCtx.createGain();
        purrOsc.type = 'sawtooth'; purrOsc.frequency.setValueAtTime(25, audioCtx.currentTime);
        lfo.frequency.setValueAtTime(2, audioCtx.currentTime);
        lfoGain.gain.setValueAtTime(0.005, audioCtx.currentTime);
        lfo.connect(lfoGain); lfoGain.connect(purrGain.gain);
        purrGain.gain.setValueAtTime(0.01, audioCtx.currentTime);
        purrOsc.connect(purrGain); purrGain.connect(audioCtx.destination);
        purrOsc.start(); lfo.start();
        document.getElementById('idle-pet').classList.add('purring');
    }

    function stopPurr() {
        if (purrOsc) { try { purrOsc.stop(); purrOsc.disconnect(); } catch(e){} }
        document.getElementById('idle-pet').classList.remove('purring');
    }

    function resetIdle() {
        const pet = document.getElementById('idle-pet');
        pet.style.opacity = "0"; stopPurr();
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => { pet.style.opacity = "0.6"; startPurr(); }, 20000);

        // Security Auto-Lock (3 Minutes) - Returns to Splash Screen
        clearTimeout(sessionTimeout);
        if (viewState !== "splash") {
            sessionTimeout = setTimeout(() => {
                playSound(150, 'sawtooth', 0.5, 0.2);
                renderSplash();
            }, 180000); 
        }
    }

    function getHeader() {
        return `
            <div class="system-stats">
                <div>CPU [|||||| 42%] <br> MEM [||| 1.2GB/8GB]</div>
                <div style="text-align: right">USER: ${isSecretAccess ? "ROOT" : "GUEST"}<br>TIME: ${new Date().toLocaleTimeString()}</div>
            </div>
        `;
    }

    function handleKeyDown(e) {
        resetIdle();

        if (e.key === konamiCode[konamiIndex]) {
            konamiIndex++;
            if (konamiIndex === konamiCode.length) {
                document.body.classList.toggle('override');
                playSound(2000, 'sine', 0.2, 0.1);
                konamiIndex = 0;
            }
        } else { konamiIndex = 0; }

        if (document.getElementById('image-modal').style.display === 'flex') {
            if (e.key === "Escape" || e.key === "Enter") closeModal();
            else if (e.key === "ArrowRight") {
                navigateGallery(1);
                const files = currentSubFolder ? getDatabase()[currentFolderName][currentSubFolder] : getDatabase()[currentFolderName];
                const card = files[currentFileIndex];
                openModal(card.file, card.caption || `${card.title}.IMG`);
            } else if (e.key === "ArrowLeft") {
                navigateGallery(-1);
                const files = currentSubFolder ? getDatabase()[currentFolderName][currentSubFolder] : getDatabase()[currentFolderName];
                const card = files[currentFileIndex];
                openModal(card.file, card.caption || `${card.title}.IMG`);
            }
            return;
        }

        if (viewState === "splash") { playSound(800, 'sine', 0.05, 0.1); bootSystem(); return; }

        const items = terminal.querySelectorAll('li, .pin-btn, .clickable');
        
        if (e.key === "ArrowDown") {
            selectedIndex = (selectedIndex + 1) % items.length;
            playSound(1200, 'sine', 0.01, 0.05);
            updateSelection();
        } else if (e.key === "ArrowUp") {
            selectedIndex = (selectedIndex - 1 + items.length) % items.length;
            playSound(1200, 'sine', 0.01, 0.05);
            updateSelection();
        } else if (e.key === "Enter" && items[selectedIndex]) {
            items[selectedIndex].click();
        } else if (e.key === "Escape") {
            playSound(600, 'sine', 0.1, 0.05);
            if (viewState === "root") renderSplash();
            else if (viewState === "dir" && currentSubFolder) openDir(currentFolderName);
            else if (viewState === "dir") renderRoot();
            else if (viewState === "file") openDir(currentFolderName, true, currentSubFolder);
        } else if (viewState === "file" && e.key === "ArrowRight") navigateGallery(1);
        else if (viewState === "file" && e.key === "ArrowLeft") navigateGallery(-1);
        else if (!isNaN(e.key) && viewState === "pin") pressKey(e.key);
    }

    function refreshSelectableItems() {
        const items = terminal.querySelectorAll('li, .pin-btn, .clickable');
        items.forEach((item, idx) => {
            item.addEventListener("mouseenter", () => {
                selectedIndex = idx;
                updateSelection();
            });
            item.addEventListener("click", () => {
                selectedIndex = idx;
                updateSelection();
            });
        });
    }

    function updateSelection() {
        const items = terminal.querySelectorAll('li, .pin-btn, .clickable');
        items.forEach((item, idx) => {
            const isSelected = idx === selectedIndex;
            item.classList.toggle('selected', isSelected);
            if (isSelected && (viewState === "dir" || viewState === "root")) {
                item.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        });
    }

    function renderSplash() {
        viewState = "splash";
        terminal.innerHTML = `
            <div class="card-view" onclick="bootSystem()">
                <pre class="glitch" style="font-size: 8pt; line-height: 1;">
 ██████╗███╗   ███╗ ██████╗ 
██╔════╝████╗ ████║██╔════╝ 
██║     ██╔████╔██║██║      
██║     ██║╚██╔╝██║██║      
╚██████╗██║ ╚═╝ ██║╚██████╗ 
 ╚═════╝╚═╝     ╚═╝ ╚═════╝ 
                </pre>
                <p>[ SECURE VAULT ACCESS ]</p>
                <p style="border: 1px solid var(--bright-green); padding: 8px 20px; cursor: pointer;">PRESS ANY KEY TO START</p>
            </div>
        `;
    }

    function bootSystem() {
        if (!databaseReady()) return renderDatabaseError();

        viewState = "pin"; inputBuffer = "";
        terminal.innerHTML = getHeader() + `
            <div class="path">A:\AUTHORIZATION</div>
            <div class="card-view">
                <p class="glitch">AUTHORIZATION REQUIRED</p>
                <h2 id="pin-display" style="letter-spacing: 12px; border: 1px solid var(--dark-green); padding: 10px;">____</h2>
                <div class="keypad-grid">
                    <button id="btn-1" class="pin-btn" onclick="pressKey('1')">1</button>
                    <button id="btn-2" class="pin-btn" onclick="pressKey('2')">2</button>
                    <button id="btn-3" class="pin-btn" onclick="pressKey('3')">3</button>
                    <button id="btn-4" class="pin-btn" onclick="pressKey('4')">4</button>
                    <button id="btn-5" class="pin-btn" onclick="pressKey('5')">5</button>
                    <button id="btn-6" class="pin-btn" onclick="pressKey('6')">6</button>
                    <button id="btn-7" class="pin-btn" onclick="pressKey('7')">7</button>
                    <button id="btn-8" class="pin-btn" onclick="pressKey('8')">8</button>
                    <button id="btn-9" class="pin-btn" onclick="pressKey('9')">9</button>
                    <button id="btn-clr" class="pin-btn" onclick="inputBuffer=''; document.getElementById('pin-display').innerText='____'; flashKey('clr');">CLR</button>
                    <button id="btn-0" class="pin-btn" onclick="pressKey('0')">0</button>
                    <button id="btn-ent" class="pin-btn" onclick="verifyPin(); flashKey('ent');">ENT</button>
                </div>
            </div>
        `;
        refreshSelectableItems();
        updateSelection();
    }

    function flashKey(idSuffix) {
        const btn = document.getElementById(`btn-${idSuffix}`);
        if (btn) {
            btn.classList.add('active-flash');
            setTimeout(() => btn.classList.remove('active-flash'), 100);
        }
    }

    function pressKey(num) {
        flashKey(num);
        if (inputBuffer.length < 4) {
            inputBuffer += num;
            document.getElementById('pin-display').innerText = inputBuffer.padEnd(4, "_");
            playSound(1200, 'triangle', 0.02, 0.1);
        }
        if (inputBuffer.length === 4) setTimeout(verifyPin, 250);
    }

    async function verifyPin() {
        const enteredHash = await sha256(inputBuffer);
        if (enteredHash === CORRECT_PIN_HASH || enteredHash === SECRET_PIN_HASH) {
            isSecretAccess = enteredHash === SECRET_PIN_HASH;
            playSound(1800, 'sine', 0.1, 0.1);
            renderRoot();
        } else {
            isSecretAccess = false;
            playSound(150, 'sawtooth', 0.5, 0.2);
            inputBuffer = "";
            const display = document.getElementById('pin-display');
            if (display) display.innerText = "____";
        }
    }

    function renderRoot() {
        viewState = "root"; selectedIndex = 0;
        let html = getHeader() + `<div class="path">A:\ROOT</div><ul>`;
        html += `<li onclick="renderSplash(); playSound(600, 'sine', 0.1, 0.05);">[!] LOGOFF SYSTEM</li>`;
        const db = getDatabase();
        if (!db) return renderDatabaseError();

        for (let folder in db) {
            if (folder === "SECRET_VAULT" && !isSecretAccess) continue;
            const safeFolder = escapeHTML(folder.toUpperCase());
            const jsFolder = escapeJS(folder);
            html += `<li onclick="openDir('${jsFolder}')">drwxr-xr-x   [DIR]  ${safeFolder}</li>`;
        }
        terminal.innerHTML = html + `</ul>`;
        refreshSelectableItems();
        updateSelection();
    }

    function openDir(name, useMemory = false, sub = "") {
        viewState = "dir"; currentFolderName = name; currentSubFolder = sub;
        selectedIndex = useMemory ? lastFileSelectionIndex : 1;
        const data = database[name];
        
        let pathStr = `A:\\${name.toUpperCase()}`;
        if(sub) pathStr += `\\${sub.toUpperCase()}`;
        
        let html = getHeader() + `<div class="path">${pathStr}</div><ul>`;
        
        if(sub) {
            html += `<li onclick="openDir('${escapeJS(name)}'); playSound(600, 'sine', 0.1, 0.05);">[..] GO BACK</li>`;
            data[sub].forEach((card, i) => {
                html += `<li onclick="viewCard('${escapeJS(name)}', ${i}, '${escapeJS(sub)}'); playSound(1500, 'sine', 0.05, 0.05);">-rw-r--r--   ${escapeHTML(card.size)}   ${escapeHTML(card.title)}.IMG</li>`;
            });
        } else if (!Array.isArray(data)) {
            html += `<li onclick="renderRoot(); playSound(600, 'sine', 0.1, 0.05);">[..] GO BACK</li>`;
            Object.keys(data).forEach(subKey => {
                html += `<li onclick="openDir('${escapeJS(name)}', false, '${escapeJS(subKey)}')">drwxr-xr-x   [DIR]  ${escapeHTML(subKey)}</li>`;
            });
        } else {
            html += `<li onclick="renderRoot(); playSound(600, 'sine', 0.1, 0.05);">[..] GO BACK</li>`;
            data.forEach((card, i) => {
                html += `<li onclick="viewCard('${escapeJS(name)}', ${i}); playSound(1500, 'sine', 0.05, 0.05);">-rw-r--r--   ${escapeHTML(card.size)}   ${escapeHTML(card.title)}.IMG</li>`;
            });
        }
        
        terminal.innerHTML = html + `</ul>`;
        refreshSelectableItems();
        updateSelection();
    }

    function navigateGallery(direction) {
        const db = getDatabase();
        if (!db) return renderDatabaseError();
        const files = currentSubFolder ? db[currentFolderName][currentSubFolder] : db[currentFolderName];
        currentFileIndex = (currentFileIndex + direction + files.length) % files.length;
        viewCard(currentFolderName, currentFileIndex, currentSubFolder);
    }

    function viewCard(dir, idx, sub = "") {
        viewState = "file";
        currentFileIndex = idx;
        lastFileSelectionIndex = idx + 1;

        const db = getDatabase();
        if (!db) return renderDatabaseError();

        const folder = db[dir];
        const files = sub ? folder?.[sub] : folder;
        if (!files || !files[idx]) return renderDatabaseError();

        const card = files[idx];
        const total = files.length;
        const safeDir = escapeHTML(dir.toUpperCase());
        const safeSub = escapeHTML(sub.toUpperCase());
        const safeTitle = escapeHTML(card.title);
        const safeCaption = escapeHTML(card.caption);
        const safeId = escapeHTML(card.id);
        const safeDate = escapeHTML(card.date);
        const safeSize = escapeHTML(card.size);
        const jsDir = escapeJS(dir);
        const jsSub = escapeJS(sub);
        const jsFile = escapeJS(card.file);

        let pathStr = `A:\\${safeDir}`;
        if (sub) pathStr += `\\${safeSub}`;
        pathStr += `\\${safeTitle}.IMG`;

        terminal.innerHTML = getHeader() + `
            <div class="path">${pathStr}</div>
            <div class="card-view">
                <div id="image-container" style="height: 250px; width: 90%; display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">
                    <p class="glitch" style="font-size: 1.2rem;">>>> RETRIEVING DATA...</p>
                </div>
                <table class="metadata-table">
                    <tr><td>REF_ID</td><td>${safeId}</td><td>INDEX</td><td>${idx + 1} / ${total}</td></tr>
                    <tr><td>DATE ADDED</td><td>${safeDate}</td><td>SIZE</td><td>${safeSize}</td></tr>
                    <tr><td colspan="2">CAPTION</td><td colspan="2">${safeCaption}</td></tr>
                </table>
                <div style="margin-top: 15px; display: flex; gap: 15px;">
                    <span class="clickable" onclick="navigateGallery(-1)">[ ← PREV ]</span>
                    <span class="clickable" onclick="playSound(600, 'sine', 0.1, 0.05); openDir('${jsDir}', true, '${jsSub}')">[ ESC: EXIT ]</span>
                    <span class="clickable" onclick="navigateGallery(1)">[ NEXT → ]</span>
                </div>
                <div style="margin-top: 10px;">
                    <span class="clickable" onclick="showSaveHelp(event, '${jsFile}')">[ SAVE HELP ]</span>
                </div>
            </div>
        `;

        refreshSelectableItems();

        const img = new Image();
        img.className = "terminal-img";
        img.alt = card.caption || `${card.title}.IMG`;
        img.decoding = "async";
        img.onclick = () => openModal(card.file, img.alt);

        img.onload = () => {
            const container = document.getElementById("image-container");
            if (container) {
                container.innerHTML = "";
                container.appendChild(img);
            }
        };

        img.onerror = () => {
            const container = document.getElementById("image-container");
            if (container) {
                container.innerHTML = '<p class="glitch">>>> IMAGE LOAD FAILED</p>';
            }
        };

        img.src = card.file;
    }

    function openModal(src, altText = "Enlarged image view") {
        const modalImg = document.getElementById('modal-img');
        modalImg.src = src;
        modalImg.alt = altText;
        document.getElementById('image-modal').style.display = 'flex';
        playSound(1500, 'sine', 0.1, 0.05);
    }

    function closeModal() { 
        document.getElementById('image-modal').style.display = 'none'; 
        playSound(600, 'sine', 0.1, 0.05); 
    }
	
    document.addEventListener('mousedown', resetIdle);
    renderSplash();
</script>

</body>
</html>
