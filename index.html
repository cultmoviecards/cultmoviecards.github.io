<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/ico" href="/favicon.ico"/>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMC v2.62</title>
    <style>
        @font-face {
            font-family: 'GlassTTY';
            src: url('./fonts/Glass_TTY_VT220.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --bright-green: #00FF41;
            --dark-green: #003B00;
            --bg-black: #050505;
            --crt-glow: 0 0 6px rgba(0, 255, 65, 0.16);
            --amber: #ffb000;
        }

        body.override {
            --bright-green: var(--amber);
            --dark-green: #5e4100;
            --crt-glow: 0 0 6px rgba(255, 176, 0, 0.16);
        }

        body {
            background-color: var(--bg-black);
            color: var(--bright-green);
            font-family: 'GlassTTY', monospace;
            font-size: 15px;
            letter-spacing: 0.4px;
            text-rendering: optimizeSpeed;
            -webkit-font-smoothing: none;
            font-smooth: never;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-transform: uppercase;
        }

        body::after, #image-modal::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 120;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
            will-change: auto;
        }

        .scanline {
            width: 100%;
            height: 100px;
            z-index: 121;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(0, 255, 65, 0.05) 50%, rgba(0, 0, 0, 0) 100%);
            opacity: 0.1;
            position: fixed;
            top: 0;
            left: 0;
            animation: scanline 8s linear infinite;
            pointer-events: none;
            will-change: transform;
        }

        @keyframes scanline {
            0% { transform: translateY(-100px); }
            100% { transform: translateY(100vh); }
        }

        .monitor-frame {
            padding: 25px; background: #121212; border: 12px solid #222;
            border-radius: 40px; box-shadow: inset 0 0 50px #000, 0 20px 50px rgba(0,0,0,0.8);
            position: relative; z-index: 5;
            max-width: 96vw;
            max-height: 96vh;
            box-sizing: border-box;
        }

        .crt-screen {
            width: min(850px, calc(96vw - 74px));
            height: min(550px, calc(96vh - 74px));
            min-width: 320px;
            min-height: 420px;
            background: var(--bg-black);
            position: relative; overflow: hidden; border: 15px solid #111; border-radius: 10px;
            box-sizing: border-box;
        }

        #terminal-content { padding: 15px; height: 100%; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden; }

        .system-stats {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
            border-bottom: 1px solid var(--dark-green); padding-bottom: 8px; font-size: 8.5pt; opacity: 0.8;
        }

        .path { background: var(--bright-green); color: var(--bg-black); padding: 2px 8px; margin: 10px 0; font-weight: bold; }
        
        ul { list-style: none; padding: 0; flex-grow: 1; overflow-y: auto; scroll-behavior: smooth; }
        li { padding: 4px 10px; cursor: pointer; white-space: pre; border-left: 3px solid transparent; }
        li.selected { background: var(--bright-green); color: var(--bg-black); border-left: 3px solid var(--amber); }

        .card-view { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; animation: flicker 0.15s infinite; }
        @keyframes flicker { 0% { opacity: 0.98; } 50% { opacity: 1; } 100% { opacity: 0.99; } }

        .terminal-img, #modal-img {
            border: 1px solid var(--bright-green);
            filter: contrast(1) brightness(1);
            box-shadow: var(--crt-glow);
        }

        .terminal-img {
            max-height: 315px;
            max-width: 94%;
            width: auto;
            height: auto;
            object-fit: contain;
            cursor: zoom-in !important;
        }

        #image-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.98); z-index: 110;
            justify-content: center; align-items: center; cursor: zoom-out;
            animation: flicker 0.15s infinite;
            box-sizing: border-box;
            padding: 118px 150px 34px;
        }

        #modal-img {
            cursor: zoom-out !important;
            max-width: calc(100vw - 330px);
            max-height: calc(100vh - 170px);
        }

        #modal-loading {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            translate: -50% -50%;
            transform: none;
            z-index: 114;
            min-width: 360px;
            padding: 14px 22px;
            border: 1px solid var(--bright-green);
            background: rgba(5, 5, 5, 0.92);
            color: var(--bright-green);
            font-size: clamp(14px, 2vw, 28px);
            letter-spacing: 1px;
            text-align: center;
            text-shadow: 0 0 8px rgba(0, 255, 65, 0.75);
            box-shadow: var(--crt-glow);
            pointer-events: none;
        }

        #image-modal.loading #modal-loading {
            display: block;
        }

        #image-modal.loading #modal-img {
            opacity: 0.28;
        }

        #modal-topbar {
            position: absolute;
            top: 24px;
            left: 36px;
            right: 36px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 18px;
            align-items: start;
            border-bottom: 1px solid var(--dark-green);
            padding-bottom: 12px;
            color: var(--bright-green);
            font-size: 9pt;
            line-height: 1.5;
            cursor: default;
            z-index: 112;
        }

        #modal-close-hint {
            text-align: center;
            opacity: 0.9;
            white-space: nowrap;
        }

        #modal-user-info {
            text-align: right;
            white-space: nowrap;
        }

        .modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 113;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            border: 0;
            background: transparent;
            color: var(--bright-green);
            font-family: 'GlassTTY', monospace;
            text-transform: uppercase;
            cursor: pointer;
            text-shadow: 0 0 8px rgba(0, 255, 65, 0.65);
        }

        .modal-prev { left: 46px; }
        .modal-next { right: 46px; }

        .modal-arrow {
            font-size: clamp(56px, 8vw, 118px);
            line-height: 0.8;
        }

        .modal-label {
            font-size: clamp(13px, 1.8vw, 22px);
            letter-spacing: 1px;
        }

        .modal-nav:hover .modal-label,
        .modal-nav:focus .modal-label {
            background: var(--bright-green);
            color: var(--bg-black);
        }

        @media (max-width: 720px) {
            #image-modal {
                padding: 82px 62px 20px;
            }
            #modal-img {
                max-width: calc(100vw - 136px);
                max-height: calc(100vh - 125px);
            }
            .modal-prev { left: 8px; }
            .modal-next { right: 8px; }
            #modal-topbar {
                left: 16px;
                right: 16px;
                grid-template-columns: 1fr;
                gap: 2px;
                font-size: 7.2pt;
            }
            #modal-close-hint,
            #modal-user-info {
                text-align: left;
            }
        }

        .metadata-table { width: 100%; border-collapse: collapse; font-size: 9px; margin-top: 5px; }
        .metadata-table td {
            border: 1px solid var(--dark-green);
            padding: 4px 10px;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .glitch { animation: glitch-text 0.5s infinite; }
        @keyframes glitch-text {
            0% { text-shadow: 2px 0 red, -2px 0 blue; transform: translate(1px, 1px); }
            50% { text-shadow: -2px 0 red, 2px 0 blue; transform: translate(-1px, -1px); }
            100% { text-shadow: 2px 0 red, -2px 0 blue; transform: translate(1px, -1px); }
        }

        .clickable { cursor: pointer; padding: 2px 8px; border: 1px solid transparent; }
        .clickable:hover, .clickable.selected { background: var(--bright-green); color: var(--bg-black); }

        #system-message {
            display: none;
            position: absolute;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            width: 72%;
            padding: 12px 16px;
            background: rgba(5, 5, 5, 0.96);
            border: 1px solid var(--bright-green);
            box-shadow: var(--crt-glow);
            z-index: 130;
            font-size: 8.5pt;
            line-height: 1.5;
        }

        #system-message .system-title {
            display: inline-block;
            margin-bottom: 6px;
            padding: 1px 6px;
            background: var(--bright-green);
            color: var(--bg-black);
            font-weight: bold;
        }

        #system-message .prompt-options {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        #system-message .prompt-hint {
            margin-top: 8px;
            opacity: 0.75;
            font-size: 7.5pt;
        }


        @media (max-width: 720px) {
            .monitor-frame {
                padding: 12px;
                border-width: 6px;
                border-radius: 24px;
            }

            .crt-screen {
                width: calc(100vw - 48px);
                height: calc(100vh - 48px);
                border-width: 8px;
            }

            #terminal-content {
                padding: 10px;
            }

            .system-stats {
                grid-template-columns: 1fr;
                gap: 6px;
                font-size: 7.5pt;
            }

            .terminal-img {
            max-height: 315px;
            max-width: 94%;
            width: auto;
            height: auto;
            object-fit: contain;
            cursor: zoom-in !important;
        }

            #system-message {
                position: fixed;
                width: 82%;
                bottom: 18px;
            }
        }



        /* --- Analog phosphor persistence / ghost trails --- */
        .phosphor-ghost {
            position: fixed;
            margin: 0;
            pointer-events: none;
            z-index: 150;
            opacity: 0;
            filter: blur(1.05px) drop-shadow(0 0 7px var(--bright-green));
            mix-blend-mode: screen;
            transform: translate(var(--ghost-dx, 0px), var(--ghost-dy, 0px));
            animation: phosphor-afterimage var(--ghost-life, 520ms) ease-out forwards;
            will-change: opacity, transform, filter;
        }

        @keyframes phosphor-afterimage {
            0% { opacity: var(--ghost-opacity, 0.16); }
            38% { opacity: calc(var(--ghost-opacity, 0.16) * 0.72); }
            72% { opacity: calc(var(--ghost-opacity, 0.16) * 0.28); }
            100% {
                opacity: 0;
                transform: translate(calc(var(--ghost-dx, 0px) * 2.2), calc(var(--ghost-dy, 0px) * 2.2));
                filter: blur(1.35px) drop-shadow(0 0 3px var(--bright-green));
            }
        }

        /* --- Site-wide phosphor burn-in persistence ---
           When terminal content changes, a faint snapshot of the previous frame
           lingers briefly over the new one, mimicking slow-decay phosphor. */
        .screen-burn-ghost {
            position: fixed;
            pointer-events: none;
            z-index: 122;
            overflow: hidden;
            box-sizing: border-box;
            color: var(--bright-green);
            background: transparent;
            opacity: 0;
            filter: blur(0.55px) drop-shadow(0 0 4px var(--bright-green));
            mix-blend-mode: screen;
            animation: screen-burn-persist var(--burn-life, 720ms) ease-out forwards;
            transform: translate(var(--burn-x, 0px), var(--burn-y, 0px));
            contain: layout paint style;
        }

        .screen-burn-ghost * {
            pointer-events: none !important;
        }

        @keyframes screen-burn-persist {
            0% {
                opacity: var(--burn-opacity, 0.045);
                transform: translate(var(--burn-x, 0px), var(--burn-y, 0px)) scale(1);
                filter: blur(0.45px) drop-shadow(0 0 4px var(--bright-green));
            }
            42% {
                opacity: calc(var(--burn-opacity, 0.045) * 0.58);
                transform: translate(calc(var(--burn-x, 0px) * 1.35), calc(var(--burn-y, 0px) * 1.35)) scale(1.002);
            }
            78% {
                opacity: calc(var(--burn-opacity, 0.045) * 0.18);
                filter: blur(1.25px) drop-shadow(0 0 5px var(--bright-green));
            }
            100% {
                opacity: 0;
                transform: translate(calc(var(--burn-x, 0px) * 1.8), calc(var(--burn-y, 0px) * 1.8)) scale(1.006);
                filter: blur(1.7px) drop-shadow(0 0 2px var(--bright-green));
            }
        }

        .chess-piece.phosphor-piece-trail {
            position: absolute;
            inset: 7%;
            width: 86% !important;
            height: 86% !important;
            z-index: 0;
            pointer-events: none;
            opacity: 0;
            filter: blur(0.7px) drop-shadow(0 0 4px var(--bright-green));
            mix-blend-mode: screen;
            transform: translate(var(--trail-x, 0px), var(--trail-y, 0px));
            animation: phosphor-piece-trail 230ms ease-out forwards;
        }

        @keyframes phosphor-piece-trail {
            0% { opacity: 0.10; }
            55% { opacity: 0.055; }
            100% { opacity: 0; transform: translate(0,0); filter: blur(1px) drop-shadow(0 0 2px var(--bright-green)); }
        }



        /* --- CRT hardware fatigue / imperfect scanline zones --- */
        .crt-fatigue {
            position: absolute;
            inset: 0;
            z-index: 45;
            pointer-events: none;
            overflow: hidden;
            mix-blend-mode: screen;
            opacity: 0.9;
        }

        .crt-fatigue::before,
        .crt-fatigue::after {
            content: "";
            position: absolute;
            left: -3%;
            right: -3%;
            pointer-events: none;
            will-change: transform, opacity;
        }

        /* A dimmer tired patch through the middle of the tube. */
        .crt-fatigue::before {
            top: 38%;
            height: 23%;
            background:
                linear-gradient(180deg,
                    rgba(0,0,0,0) 0%,
                    rgba(0,0,0,0.075) 18%,
                    rgba(0,0,0,0.13) 52%,
                    rgba(0,0,0,0.065) 78%,
                    rgba(0,0,0,0) 100%);
            mix-blend-mode: normal;
            animation: crt-dim-drift 11s ease-in-out infinite alternate;
        }

        /* Soft bright/dark horizontal fatigue bands with nonuniform timing. */
        .crt-fatigue::after {
            top: -10%;
            bottom: -10%;
            background:
                linear-gradient(180deg,
                    transparent 0%,
                    rgba(0,255,65,0.018) 10%,
                    transparent 16%,
                    transparent 33%,
                    rgba(0,0,0,0.105) 39%,
                    rgba(0,0,0,0.055) 45%,
                    transparent 53%,
                    transparent 66%,
                    rgba(0,255,65,0.014) 72%,
                    rgba(0,0,0,0.08) 78%,
                    transparent 86%,
                    transparent 100%);
            opacity: 0.62;
            animation: crt-band-drift 17s ease-in-out infinite;
        }

        .crt-warp-edge {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 9%;
            pointer-events: none;
            z-index: 46;
            opacity: 0.34;
            mix-blend-mode: screen;
            background:
                repeating-linear-gradient(180deg,
                    rgba(0,255,65,0.018) 0 1px,
                    rgba(0,0,0,0) 1px 3px),
                linear-gradient(90deg,
                    rgba(0,255,65,0.032),
                    rgba(0,0,0,0));
            filter: blur(0.25px);
            will-change: transform, opacity;
        }

        .crt-warp-edge.left {
            left: 0;
            transform-origin: left center;
            animation: crt-edge-bend-left 7.5s ease-in-out infinite;
        }

        .crt-warp-edge.right {
            right: 0;
            transform-origin: right center;
            transform: scaleX(-1);
            animation: crt-edge-bend-right 9s ease-in-out infinite;
        }

        .crt-collapse-band {
            position: absolute;
            left: -4%;
            right: -4%;
            top: 17%;
            height: 8%;
            z-index: 47;
            pointer-events: none;
            opacity: 0.12;
            background:
                repeating-linear-gradient(180deg,
                    rgba(0,255,65,0.055) 0 1px,
                    transparent 1px 4px),
                linear-gradient(180deg, transparent, rgba(0,255,65,0.045), transparent);
            filter: blur(0.35px);
            transform: translateY(0) skewX(-0.35deg);
            animation: crt-collapse-wobble 5.8s ease-in-out infinite;
            mix-blend-mode: screen;
        }

        @keyframes crt-dim-drift {
            0% { transform: translateY(-1.5%) scaleY(0.96); opacity: 0.75; }
            50% { transform: translateY(2%) scaleY(1.04); opacity: 0.95; }
            100% { transform: translateY(-0.5%) scaleY(1); opacity: 0.82; }
        }

        @keyframes crt-band-drift {
            0%, 100% { transform: translateY(-1%) skewY(0deg); opacity: 0.48; }
            35% { transform: translateY(1.8%) skewY(0.18deg); opacity: 0.68; }
            72% { transform: translateY(-0.6%) skewY(-0.14deg); opacity: 0.57; }
        }

        @keyframes crt-edge-bend-left {
            0%, 100% { transform: translateX(0) skewY(0deg) scaleX(1); opacity: 0.24; }
            28% { transform: translateX(1px) skewY(0.65deg) scaleX(1.08); opacity: 0.38; }
            63% { transform: translateX(-1px) skewY(-0.45deg) scaleX(0.96); opacity: 0.29; }
        }

        @keyframes crt-edge-bend-right {
            0%, 100% { transform: scaleX(-1) translateX(0) skewY(0deg); opacity: 0.21; }
            42% { transform: scaleX(-1) translateX(1px) skewY(-0.55deg); opacity: 0.36; }
            76% { transform: scaleX(-1) translateX(-1px) skewY(0.42deg); opacity: 0.27; }
        }

        @keyframes crt-collapse-wobble {
            0%, 100% { transform: translateY(0) skewX(-0.25deg); opacity: 0.08; }
            18% { transform: translateY(2px) skewX(0.55deg); opacity: 0.15; }
            54% { transform: translateY(-1px) skewX(-0.75deg); opacity: 0.11; }
            82% { transform: translateY(1px) skewX(0.2deg); opacity: 0.18; }
        }



        /* --- CRT edge convergence distortion / corner fringing --- */
        .crt-convergence {
            position: absolute;
            inset: 0;
            z-index: 49;
            pointer-events: none;
            overflow: hidden;
            opacity: 0.72;
            mix-blend-mode: screen;
        }

        .crt-convergence::before,
        .crt-convergence::after {
            content: "";
            position: absolute;
            inset: -2px;
            pointer-events: none;
            opacity: 0.5;
            will-change: transform, opacity, filter;
        }

        /* Red/cyan registration error strongest where the tube meets the bezel. */
        .crt-convergence::before {
            background:
                radial-gradient(circle at 0% 0%, rgba(255, 28, 28, 0.145), transparent 24%),
                radial-gradient(circle at 100% 100%, rgba(0, 185, 255, 0.13), transparent 25%),
                linear-gradient(90deg, rgba(255,0,0,0.055), transparent 12%, transparent 88%, rgba(0,190,255,0.05)),
                linear-gradient(180deg, rgba(255,0,0,0.04), transparent 14%, transparent 86%, rgba(0,190,255,0.04));
            filter: blur(0.45px);
            transform: translate(-0.65px, -0.2px);
            animation: crt-convergence-red 8.8s ease-in-out infinite;
        }

        .crt-convergence::after {
            background:
                radial-gradient(circle at 100% 0%, rgba(0, 255, 180, 0.105), transparent 23%),
                radial-gradient(circle at 0% 100%, rgba(255, 64, 64, 0.085), transparent 24%),
                repeating-linear-gradient(180deg, rgba(0,255,65,0.026) 0 1px, transparent 1px 4px);
            filter: blur(0.65px);
            transform: translate(0.7px, 0.25px) skewY(0.06deg);
            animation: crt-convergence-cyan 10.6s ease-in-out infinite;
        }

        .crt-corner-fringe {
            position: absolute;
            width: 23%;
            height: 23%;
            pointer-events: none;
            opacity: 0.36;
            mix-blend-mode: screen;
            filter: blur(0.45px);
            background:
                linear-gradient(90deg, rgba(255,0,0,0.12), transparent 34%),
                linear-gradient(180deg, rgba(0,180,255,0.09), transparent 42%),
                repeating-linear-gradient(0deg, rgba(0,255,65,0.03) 0 1px, transparent 1px 3px);
            animation: crt-corner-crawl 12s ease-in-out infinite;
        }

        .crt-corner-fringe.tl { top: 0; left: 0; transform-origin: top left; }
        .crt-corner-fringe.tr { top: 0; right: 0; transform: scaleX(-1); transform-origin: top right; animation-duration: 13.5s; }
        .crt-corner-fringe.bl { bottom: 0; left: 0; transform: scaleY(-1); transform-origin: bottom left; animation-duration: 11.2s; }
        .crt-corner-fringe.br { bottom: 0; right: 0; transform: scale(-1); transform-origin: bottom right; animation-duration: 14.1s; opacity: 0.46; }

        /* Tiny global registration error for terminal chrome: visible on borders/file names, still readable. */
        .path,
        li,
        .metadata-table td,
        .system-stats,
        #system-message {
            text-shadow:
                -0.65px 0 rgba(255, 32, 32, 0.22),
                0.7px 0 rgba(0, 210, 255, 0.18),
                0 0 5px rgba(0, 255, 65, 0.18);
        }

        .path,
        .metadata-table td,
        #system-message,
        .terminal-img,
        #chess-board,
        .chess-log,
        .chess-history,
        .chess-stats {
            box-shadow:
                var(--crt-glow),
                -1px 0 rgba(255, 32, 32, 0.08),
                1px 0 rgba(0, 210, 255, 0.07);
        }

        @keyframes crt-convergence-red {
            0%, 100% { transform: translate(-0.55px, -0.15px) skewY(0.03deg); opacity: 0.42; }
            32% { transform: translate(-1px, 0.15px) skewY(-0.05deg); opacity: 0.56; }
            68% { transform: translate(-0.25px, -0.35px) skewY(0.08deg); opacity: 0.47; }
        }

        @keyframes crt-convergence-cyan {
            0%, 100% { transform: translate(0.55px, 0.2px) skewY(0.04deg); opacity: 0.36; }
            40% { transform: translate(0.95px, -0.1px) skewY(0.1deg); opacity: 0.52; }
            75% { transform: translate(0.2px, 0.45px) skewY(-0.06deg); opacity: 0.43; }
        }

        @keyframes crt-corner-crawl {
            0%, 100% { opacity: 0.25; filter: blur(0.4px); }
            45% { opacity: 0.46; filter: blur(0.75px); }
            72% { opacity: 0.32; filter: blur(0.55px); }
        }

        @media (prefers-reduced-motion: reduce) {
            .scanline,
            .card-view,
            .glitch,
            .purring,
            #image-modal,
            .phosphor-ghost,
            .phosphor-piece-trail,

        /* --- SAFE RETRO GLITCH PACK 1-9 (Firefox-friendly) ---
           Uses lightweight overlay elements instead of animating the whole page/body. */
        .crt-glitch-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 119;
            contain: layout paint;
        }

        .crt-glitch-layer .sync-tear-band {
            position: absolute;
            left: -6%;
            width: 112%;
            height: var(--tear-h, 22px);
            top: var(--tear-y, 42%);
            opacity: 0;
            background:
                repeating-linear-gradient(0deg, rgba(0,255,65,.07) 0 1px, transparent 1px 3px),
                linear-gradient(90deg, transparent 0%, rgba(0,255,65,.2) 30%, rgba(255,255,255,.08) 50%, transparent 100%);
            box-shadow: 0 0 18px rgba(0,255,65,.16);
            mix-blend-mode: screen;
            transform: translateX(0);
        }

        .crt-glitch-layer .signal-flash {
            position: absolute;
            inset: 0;
            opacity: 0;
            background:
                linear-gradient(90deg, rgba(255,0,40,.12), transparent 18%, transparent 82%, rgba(0,200,255,.12)),
                repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,.045) 4px, transparent 6px);
            mix-blend-mode: screen;
        }

        .crt-glitch-layer .vhs-bands {
            position: absolute;
            inset: -20% 0;
            opacity: .08;
            background:
                repeating-linear-gradient(0deg, transparent 0 7px, rgba(255,255,255,.025) 8px, transparent 12px),
                linear-gradient(180deg, transparent 0%, rgba(0,255,65,.05) 15%, transparent 22%, transparent 55%, rgba(255,255,255,.04) 61%, transparent 67%, transparent 100%);
            background-size: 100% 160px, 100% 320px;
            animation: safe-vhs-roll 9s linear infinite;
            mix-blend-mode: screen;
        }

        .crt-glitch-layer .dead-pixel {
            position: absolute;
            width: 1px;
            height: 1px;
            background: currentColor;
            color: var(--bright-green);
            opacity: var(--dead-opacity, .25);
            box-shadow: 0 0 3px currentColor;
            animation: safe-dead-flicker var(--dead-speed, 5s) steps(2,end) infinite;
        }

        .crt-glitch-layer.sync-tearing .sync-tear-band {
            animation: safe-sync-tear 135ms steps(2,end) forwards;
        }

        .crt-glitch-layer.signal-corrupting .signal-flash {
            animation: safe-signal-flash 155ms steps(2,end) forwards;
        }

        .crt-glitch-layer.vhs-bursting .vhs-bands {
            opacity: .22;
            animation: safe-vhs-roll 350ms steps(3,end) infinite;

        @keyframes safe-sync-tear {

        /* --- Recursive ghosting for boot / splash screen --- */
        .recursive-boot-ghost-safe {

        /* --- Boot-time CRT tube warmup geometry warp (safe re-implementation) ---
           Applied only to the monitor screen for under a second: vertical collapse,
           outward expansion, phosphor bloom, then stable geometry. */
        .crt-screen.tube-warming {
            transform-origin: center center;
            animation: safe-tube-geometry-warm 880ms cubic-bezier(.18,.86,.24,1) forwards;
            will-change: transform;
        }

        .crt-screen.tube-warming::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 118;
            pointer-events: none;
            opacity: 0;
            background:
                radial-gradient(ellipse at center,
                    rgba(0,255,65,.42) 0%,
                    rgba(0,255,65,.22) 18%,
                    rgba(255,255,255,.08) 31%,
                    rgba(0,0,0,0) 68%),
                linear-gradient(180deg,
                    rgba(255,255,255,.10),
                    rgba(0,255,65,.07) 48%,
                    rgba(0,0,0,0));
            mix-blend-mode: screen;
            animation: safe-tube-bloom 880ms ease-out forwards;
        }

        .crt-screen.tube-warming #terminal-content {
            transform-origin: center center;
            animation: safe-tube-content-warm 880ms cubic-bezier(.18,.86,.24,1) forwards;
            will-change: transform, opacity;
        }

        @keyframes safe-tube-geometry-warm {
            0%   { transform: scaleX(.92) scaleY(.045); }
            18%  { transform: scaleX(1.055) scaleY(.22); }
            42%  { transform: scaleX(1.028) scaleY(1.075); }
            67%  { transform: scaleX(.992) scaleY(.985); }
            100% { transform: scaleX(1) scaleY(1); }
        }

        @keyframes safe-tube-content-warm {
            0%   { opacity: 0; transform: scaleY(.12); }
            20%  { opacity: .18; transform: scaleY(.28); }

            72%  { opacity: .94; transform: scaleY(.985); }

        @keyframes safe-tube-bloom {

            20%  { opacity: .72; transform: scaleY(.24); }
            43%  { opacity: .52; transform: scaleY(1.1); }
            68%  { opacity: .18; transform: scaleY(1); }
            100% { opacity: 0; transform: scaleY(1); }
        }

        @media (prefers-reduced-motion: reduce) {

    function emitPhosphorGhostFromElement(el, options = {}) {
        if (!el || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

        const rect = el.getBoundingClientRect();
        if (!rect.width || !rect.height) return;

        const ghost = el.cloneNode(true);
        ghost.classList.add('phosphor-ghost');
        ghost.style.position = 'fixed';
        ghost.removeAttribute('id');
        ghost.style.left = `${rect.left}px`;
        ghost.style.top = `${rect.top}px`;
        ghost.style.width = `${rect.width}px`;
        ghost.style.height = `${rect.height}px`;
        ghost.style.setProperty('--ghost-opacity', options.opacity || '0.08');
        ghost.style.setProperty('--ghost-dx', options.dx || '0px');
        ghost.style.setProperty('--ghost-dy', options.dy || '0px');
        ghost.style.setProperty('--ghost-life', `${options.life || 520}ms`);

        ghost.querySelectorAll('[id]').forEach(node => node.removeAttribute('id'));
        ghost.querySelectorAll('button, a, input, [onclick]').forEach(node => {
            node.removeAttribute('onclick');
            node.tabIndex = -1;
        });

        document.body.appendChild(ghost);
        setTimeout(() => ghost.remove(), options.life || 620);
    }

    let burnInLastHTML = "";

    function sanitizeBurnInSnapshot(root) {
        root.querySelectorAll('[id]').forEach(node => node.removeAttribute('id'));
        root.querySelectorAll('button, a, input, [onclick]').forEach(node => {
            node.removeAttribute('onclick');
            node.tabIndex = -1;
        });
        root.querySelectorAll('.phosphor-ghost, .screen-burn-ghost, script').forEach(node => node.remove());
    }

    function emitScreenBurnInSnapshot(previousHTML, options = {}) {
        if (!previousHTML || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        if (!terminal || !document.body.contains(terminal)) return;

        const rect = terminal.getBoundingClientRect();
        if (!rect.width || !rect.height) return;

        const ghost = document.createElement('div');
        ghost.className = 'screen-burn-ghost';
        ghost.style.left = `${rect.left}px`;
        ghost.style.top = `${rect.top}px`;
        ghost.style.width = `${rect.width}px`;
        ghost.style.height = `${rect.height}px`;
        ghost.style.setProperty('--burn-opacity', options.opacity || '0.04');
        ghost.style.setProperty('--burn-life', `${options.life || 720}ms`);
        ghost.style.setProperty('--burn-x', options.dx || '1px');
        ghost.style.setProperty('--burn-y', options.dy || '0px');
        ghost.innerHTML = previousHTML;
        sanitizeBurnInSnapshot(ghost);

        document.body.appendChild(ghost);
        setTimeout(() => ghost.remove(), options.life || 760);
    }

    function startSiteWideBurnInPersistence() {
        if (burnInObserverStarted || !terminal || !('MutationObserver' in window)) return;
        burnInObserverStarted = true;
        burnInLastHTML = terminal.innerHTML;

        const observer = new MutationObserver(() => {
            const now = Date.now();
            const nextHTML = terminal.innerHTML;
            if (!burnInLastHTML || nextHTML === burnInLastHTML) {
                burnInLastHTML = nextHTML;
                return;
            }

            if (now - burnInLastEmit > 240) {
                burnInLastEmit = now;
                const isMajorChange = Math.abs(nextHTML.length - burnInLastHTML.length) > 80 || viewState === 'splash' || viewState === 'file' || viewState === 'dir' || viewState === 'root';
                emitScreenBurnInSnapshot(burnInLastHTML, {
                    opacity: isMajorChange ? '0.045' : '0.025',
                    life: isMajorChange ? 760 : 440,
                    dx: Math.random() > 0.5 ? '1px' : '-1px',
                    dy: Math.random() > 0.72 ? '1px' : '0px'
                });
            }

            requestAnimationFrame(() => {
                burnInLastHTML = terminal.innerHTML;
            });
        });

        observer.observe(terminal, {
            childList: true,
            subtree: true,
            characterData: true
        });
    }

    requestAnimationFrame(startSiteWideBurnInPersistence);

    function escapeHTML(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function escapeJS(value) {
        return String(value ?? "")
            .replace(/\\/g, "\\\\")
            .replace(/'/g, "\\'")
            .replace(/\n/g, "\\n")
            .replace(/\r/g, "\\r");
    }

    function getDatabase() {
        return window.database || (typeof database !== "undefined" ? database : null);
    }

    function databaseReady() {
        const db = getDatabase();
        return db && typeof db === "object";
    }


    function runDatabaseDiagnostics() {
        const db = getDatabase();
        const cards = [];
        const errors = [];
        const warnings = [];

        function collectCards(value) {
            if (Array.isArray(value)) {
                value.forEach(item => {
                    if (item && typeof item === "object") {
                        if (Array.isArray(item.cards)) collectCards(item.cards);
                        else if (Array.isArray(item.items)) collectCards(item.items);
                        else if (Array.isArray(item.files)) collectCards(item.files);
                        else cards.push(item);
                    }
                });
            } else if (value && typeof value === "object") {
                Object.values(value).forEach(collectCards);
            }
        }

        collectCards(db);

        const required = ["id", "title", "file", "size", "date", "caption"];
        const seenIds = new Set();
        const validIdPattern = /^\d{2,3}#[A-Z0-9]+$/i;

        cards.forEach((card, index) => {
            const label = card.id || `UNKNOWN CARD ${index + 1}`;

            required.forEach(field => {
                if (card[field] === undefined || card[field] === null || card[field] === "") {
                    errors.push(`MISSING ${field.toUpperCase()} -> ${label}`);
                }
            });

            if (card.id) {
                if (seenIds.has(card.id)) {
                    errors.push(`DUPLICATE ID -> ${card.id}`);
                } else {
                    seenIds.add(card.id);
                }

                if (!validIdPattern.test(card.id)) {
                    errors.push(`INVALID ID -> ${card.id}`);
                }
            }

            if (
                card.file &&
                !/^https?:\/\//i.test(card.file) &&
                !/\.(webp|jpg|jpeg|png|gif)(\?.*)?$/i.test(card.file)
            ) {
                warnings.push(`UNUSUAL FILE -> ${label}: ${card.file}`);
            }
        });

        return { total: cards.length, errors, warnings };
    }

    function showDiagnostics() {
        if (!databaseReady()) return renderDatabaseError();

        const result = runDatabaseDiagnostics();
        const statusLines = [
            `CHECKED ${result.total} RECORDS`,
            result.errors.length === 0 ? "STATUS: OK" : `ERRORS: ${result.errors.length}`,
            result.warnings.length === 0 ? "WARNINGS: 0" : `WARNINGS: ${result.warnings.length}`
        ];

        if (result.errors.length > 0) {
            statusLines.push("SEE CONSOLE FOR DETAILS");
            console.error("Database diagnostics errors:", result.errors);
        }

        if (result.warnings.length > 0) {
            console.warn("Database diagnostics warnings:", result.warnings);

        showSystemMessage("SYSTEM DIAGNOSTICS", statusLines, 7000);

    function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }

    function playSound(freq, type, dur, vol) {
        if (typeof chess !== 'undefined' && chess.boopsOn === false) return;
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
    }


    function playVectrexBootSound() {
        if (typeof chess !== 'undefined' && chess.boopsOn === false) return;
        initAudio();

        const startVectrexChime = () => {
            const now = audioCtx.currentTime + 0.01;
            const master = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();
            const osc = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const lfo = audioCtx.createOscillator();
            const lfoGain = audioCtx.createGain();

            master.gain.setValueAtTime(0.0001, now);
            master.gain.exponentialRampToValueAtTime(0.42, now + 0.08);
            master.gain.exponentialRampToValueAtTime(0.0001, now + 1.05);

            filter.type = "bandpass";
            filter.frequency.setValueAtTime(520, now);
            filter.frequency.exponentialRampToValueAtTime(2100, now + 0.82);
            filter.Q.setValueAtTime(5.5, now);

            osc.type = "sine";
            osc.frequency.setValueAtTime(95, now);
            osc.frequency.exponentialRampToValueAtTime(1450, now + 0.86);

            osc2.type = "triangle";
            osc2.frequency.setValueAtTime(190, now);
            osc2.frequency.exponentialRampToValueAtTime(900, now + 0.72);

            lfo.type = "sine";
            lfo.frequency.setValueAtTime(21, now);
            lfoGain.gain.setValueAtTime(18, now);
            lfo.connect(lfoGain);
            lfoGain.connect(osc.frequency);
            lfoGain.connect(osc2.frequency);

            osc.connect(filter);
            osc2.connect(filter);
            filter.connect(master);
            master.connect(audioCtx.destination);

            osc.start(now);
            osc2.start(now);
            lfo.start(now);
            osc.stop(now + 1.12);
            osc2.stop(now + 1.02);
            lfo.stop(now + 1.12);
        };

        if (audioCtx.state === "suspended") {
            audioCtx.resume().then(startVectrexChime).catch(() => {});
        } else {
            startVectrexChime();
        }
    }

    function startPurr() {
        initAudio();
        purrOsc = audioCtx.createOscillator();
        const lfo = audioCtx.createOscillator();

        const lfoGain = audioCtx.createGain();
        purrOsc.type = 'sawtooth'; purrOsc.frequency.setValueAtTime(25, audioCtx.currentTime);

    function makeLiveStatBar(percent, slots = 10) {
        const filled = clampLiveStat(Math.round((percent / 100) * slots), 1, slots);

    }

    function formatLiveClock() {

        });

        const db = getDatabase();
        const fileInfo = document.getElementById("modal-file-info");

        if (!db || !fileInfo || !userInfo) return;

        const files = getFilesAtPath(currentPath);
        const card = files?.[currentFileIndex];
        if (!card) return;

        const pathParts = ["A:", ...currentPath.map(part => String(part).toUpperCase())];

    function navigateModalGallery(direction) {
        const db = getDatabase();
        if (!db) return renderDatabaseError();

        const files = getFilesAtPath(currentPath);
        if (!files || !files.length) return renderDatabaseError();

        currentFileIndex = (currentFileIndex + direction + files.length) % files.length;
        const selectionKey = pathKey(currentPath);
        folderSelections[selectionKey] = currentFileIndex + 1;

        const card = files[currentFileIndex];
        const modalImg = document.getElementById("modal-img");
        if (!modalImg) return;

        showModalLoading();
        updateModalInfo();

        const preload = new Image();
        preload.onload = () => {
            modalImg.src = card.file;
            modalImg.alt = card.caption || `${card.title}.IMG`;
            hideModalLoading();
        };
        preload.onerror = () => {
            modalImg.alt = `IMAGE LOAD FAILED: ${card.caption || card.title || "UNKNOWN"}`;
            hideModalLoading();
            showSystemMessage("IMAGE LOAD FAILED", [card.title || "UNKNOWN FILE"], 3500);
        };
        preload.src = card.file;

        playSound(1500, "sine", 0.05, 0.04);
    }

    function handleKeyDown(e) {
        navigationMode = "keyboard";
        resetIdle();

        if (e.key === konamiCode[konamiIndex]) {
            konamiIndex++;
            if (konamiIndex === konamiCode.length) {
                document.body.classList.toggle('override');
                playSound(2000, 'sine', 0.2, 0.1);
                showDiagnostics();
                konamiIndex = 0;
            }
        } else { konamiIndex = 0; }

        if (viewState === "chess") { handleChessKeyDown(e); return; }

        if (document.getElementById('image-modal').style.display === 'flex') {
            if (e.key === "Escape" || e.key === "Enter") closeModal();
            else if (e.key === "ArrowRight") {
                navigateModalGallery(1);
            } else if (e.key === "ArrowLeft") {
                navigateModalGallery(-1);
            }
            return;
        }

        if (viewState === "splash") { handleSplashKeyDown(e); return; }
        if (viewState === "escape-terminal") { handleEscapeTerminalKeyDown(e); return; }
        if (viewState === "random-retrieval") {
            if (e.key === "Escape") { clearTimeout(randomRetrievalTimer); renderRoot(); }
            return;
        }

        const items = terminal.querySelectorAll('li, .pin-btn, .clickable');
        
        if (e.key === "ArrowDown") {
            emitCurrentSelectionGhost((selectedIndex + 1) % items.length);
            selectedIndex = (selectedIndex + 1) % items.length;
            playSound(1200, 'sine', 0.01, 0.05);
            updateSelection();
        } else if (e.key === "ArrowUp") {
            emitCurrentSelectionGhost((selectedIndex - 1 + items.length) % items.length);
            selectedIndex = (selectedIndex - 1 + items.length) % items.length;
            playSound(1200, 'sine', 0.01, 0.05);
            updateSelection();
        } else if (e.key === "Enter" && items[selectedIndex]) {
            items[selectedIndex].click();
        } else if (e.key === "Escape") {
            playSound(600, 'sine', 0.1, 0.05);
            if (viewState === "root") renderSplash();
            else if (viewState === "dir" && currentPath.length > 1) openPath(currentPath.slice(0, -1));
            else if (viewState === "dir") renderRoot();
            else if (viewState === "file") openPath(currentPath, true);
        } else if (["root", "dir", "file"].includes(viewState) && ["r", "R", "*"].includes(e.key)) {
            e.preventDefault();
            playRandomCardSequence(openRandomCard);
        } else if (viewState === "file" && e.key === "ArrowRight") navigateGallery(1);
        else if (viewState === "file" && e.key === "ArrowLeft") navigateGallery(-1);
        else if (!isNaN(e.key) && viewState === "pin") pressKey(e.key);
    }

    function refreshSelectableItems() {
        const items = terminal.querySelectorAll('li, .pin-btn, .clickable');
        items.forEach((item, idx) => {
            item.addEventListener("mouseenter", () => {
                if (navigationMode !== "mouse") return;

                selectedIndex = idx;
                updateSelection();
            });
            item.addEventListener("mousemove", () => {
                navigationMode = "mouse";
            });
            item.addEventListener("click", () => {
                navigationMode = "mouse";
                selectedIndex = idx;
                updateSelection();
            });
        });
    }

    function updateSelection() {
        const items = terminal.querySelectorAll('li, .pin-btn, .clickable');
        items.forEach((item, idx) => {
            const isSelected = idx === selectedIndex;
            const wasSelected = item.classList.contains('selected');
            if (wasSelected && !isSelected) {
                emitPhosphorGhostFromElement(item, { opacity: '0.065', dx: '1px', dy: '0px', life: 210 });
            }
            item.classList.toggle('selected', isSelected);
            if (isSelected && (viewState === "dir" || viewState === "root")) {
                item.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        });
    }

    function handleSplashKeyDown(e) {
        const key = String(e.key || "");
        const target = "ESCAPE";

        if (/^[0-9]$/.test(key)) {
            splashPinBuffer = (splashPinBuffer + key).slice(-4);
            playSound(980 + splashPinBuffer.length * 45, 'triangle', 0.025, 0.045);

            if (splashPinBuffer.length === 4) {
                const bootCode = splashPinBuffer;
                splashPinBuffer = "";
                bootSystem();
                inputBuffer = bootCode;
                const display = document.getElementById('pin-display');
                if (display) display.innerText = inputBuffer.padEnd(4, "_");
                setTimeout(verifyPin, 120);
            }
            return;
        }

        if (/^[a-z]$/i.test(key)) {
            const nextBuffer = (splashTypeBuffer + key.toUpperCase()).slice(-target.length);

            if (target.startsWith(nextBuffer)) {
                splashTypeBuffer = nextBuffer;
                playSound(900 + splashTypeBuffer.length * 35, 'square', 0.025, 0.035);

                if (splashTypeBuffer === target) {
                    openEscapeTerminal();
                }
                return;
            }
        }

        playSound(800, 'sine', 0.05, 0.1);
        bootSystem();
    }

    function isRestrictedRootFolder(folder) {
        return (folder === "SECRET_VAULT" || folder === "HIDDEN_VAULT") && !isSecretAccess;
    }

    function normalizePath(path) {
        if (Array.isArray(path)) return path.filter(part => part !== undefined && part !== null && String(part) !== "").map(String);
        if (typeof path === "string" && path) return [path];
        return [];
    }

    function pathKey(path) {
        return normalizePath(path).join("::");
    }

    function encodePathForJS(path) {
        return escapeJS(encodeURIComponent(JSON.stringify(normalizePath(path))));
    }

    function decodePath(encodedPath) {
        try {
            const decoded = JSON.parse(decodeURIComponent(encodedPath));
            return normalizePath(decoded);
        } catch (e) {
            return [];
        }
    }

    function getNodeAtPath(path) {
        const db = getDatabase();
        if (!db) return null;
        const parts = normalizePath(path);
        if (!parts.length) return db;
        if (isRestrictedRootFolder(parts[0])) return null;

        let node = db;
        for (const part of parts) {
            if (!node || typeof node !== "object" || !(part in node)) return null;
            node = node[part];
        }
        return node;
    }

    function getFilesAtPath(path) {
        const node = getNodeAtPath(path);
        return Array.isArray(node) ? node : null;
    }

    function isCardRecord(item) {
        return item && typeof item === "object" && !Array.isArray(item) && ("title" in item || "file" in item || "id" in item);
    }

    function pathDisplay(path, fileTitle = "") {
        const parts = ["A:", ...normalizePath(path).map(part => String(part).toUpperCase())];
        if (fileTitle) parts.push(`${String(fileTitle).toUpperCase()}.IMG`);
        return parts.map(escapeHTML).join("\\");
    }

    function getRandomCardPool() {
        const db = getDatabase();
        if (!db) return [];

        const viewCounts = JSON.parse(localStorage.getItem('cmcRandomCardViews') || '{}');
        const pool = [];

        const walk = (node, path) => {
            if (Array.isArray(node)) {
                node.forEach((card, idx) => {
                    if (!isCardRecord(card)) return;
                    const key = `${pathKey(path)}::${idx}`;
                    const viewed = viewCounts[key] || 0;
                    let weight = 10;

                    // Prefer under-seen cards so RANDOM feels more like discovery than shuffle.
                    weight += Math.max(0, 8 - viewed * 2);

                    // Slightly favor nested/curated folders; they usually feel more archival.
                    if (path.length > 1) weight += 4;

                    // Seasonal and modern anomalies get a tiny nudge without dominating.
                    const title = String(card?.title || "").toUpperCase();
                    if (/CHRISTMAS|HALLOWEEN|FRIGHT|FEATURES|SERIES/.test(title)) weight += 2;

                    pool.push({ path: [...path], folder: path[0] || "", sub: path.slice(1).join("\\"), idx, weight, key });
                });
                return;
            }

            if (node && typeof node === "object") {
                Object.keys(node).forEach(key => {
                    if (path.length === 0 && isRestrictedRootFolder(key)) return;
                    walk(node[key], [...path, key]);
                });
            }
        };

        walk(db, []);
        return pool;
    }

    function weightedRandomPick(pool) {
        const total = pool.reduce((sum, item) => sum + Math.max(1, item.weight || 1), 0);
        let roll = Math.random() * total;

        for (const item of pool) {
            roll -= Math.max(1, item.weight || 1);
            if (roll <= 0) return item;
        }

        return pool[pool.length - 1];
    }

    function recordRandomCardView(pick) {
        try {
            const viewCounts = JSON.parse(localStorage.getItem('cmcRandomCardViews') || '{}');
            viewCounts[pick.key] = (viewCounts[pick.key] || 0) + 1;
            localStorage.setItem('cmcRandomCardViews', JSON.stringify(viewCounts));
        } catch (e) {}
    }

    function openDir(name, useMemory = false, sub = "") {
        const path = [name];

    function openPath(path, useMemory = false) {
        const normalized = normalizePath(path);
        viewState = "dir";
        currentPath = normalized;
        currentFolderName = normalized[0] || "";
        currentSubFolder = normalized.slice(1).join("\\");
        const selectionKey = pathKey(normalized);
        selectedIndex = useMemory
            ? (folderSelections[selectionKey] || 1)
            : 1;

        const node = getNodeAtPath(normalized);
        if (!node) return renderDatabaseError();

        const parent = normalized.slice(0, -1);
        const backAction = parent.length
            ? `openPathFromEncoded('${encodePathForJS(parent)}')`
            : `renderRoot()`;

        let html = getHeader() + `<div class="path">${pathDisplay(normalized)}</div><ul>`;
        html += `<li onclick="${backAction}; playSound(600, 'sine', 0.1, 0.05);">[..] GO BACK</li>`;

        if (Array.isArray(node)) {
            node.forEach((card, i) => {
                if (!isCardRecord(card)) return;
                html += `<li onclick="viewCardFromEncodedPath('${encodePathForJS(normalized)}', ${i}); playSound(1500, 'sine', 0.05, 0.05);">-rw-r--r--   ${escapeHTML(card.size || "----")}   ${escapeHTML(card.title || `CARD_${i + 1}`)}.IMG</li>`;
            });
        } else if (node && typeof node === "object") {
            Object.keys(node).forEach(childKey => {
                const child = node[childKey];
                if (Array.isArray(child) || (child && typeof child === "object")) {
                    html += `<li onclick="openPathFromEncoded('${encodePathForJS([...normalized, childKey])}')">drwxr-xr-x   [DIR]  ${escapeHTML(childKey.toUpperCase())}</li>`;
                }
            });
        } else {
            return renderDatabaseError();
        }

        terminal.innerHTML = html + `</ul>`;
        refreshSelectableItems();
        updateSelection();
    }

        viewState = "file";

            dot.style.top = `${Math.random() * 100}%`;
            dot.style.color = colors[Math.floor(Math.random() * colors.length)];
            dot.style.setProperty('--dead-opacity', (0.06 + Math.random() * 0.26).toFixed(2));
            dot.style.setProperty('--dead-speed', `${2.8 + Math.random() * 7}s`);
            layer.appendChild(dot);
        }
    }

    function safeTriggerSyncTear(force = false) {
        const layer = safeGlitchLayer();
        if (!layer || (!force && Math.random() > 0.1)) return;
        layer.style.setProperty('--tear-y', `${12 + Math.floor(Math.random() * 72)}%`);
        layer.style.setProperty('--tear-h', `${10 + Math.floor(Math.random() * 34)}px`);
        const x = (Math.random() < .5 ? -1 : 1) * (6 + Math.floor(Math.random() * 16));
        layer.style.setProperty('--tear-x', `${x}px`);
        layer.style.setProperty('--tear-x-alt', `${Math.round(x * -0.55)}px`);
        safePulseClass(layer, 'sync-tearing', 145);
    }

    function safeTriggerSignalCorruption(force = false) {
        const layer = safeGlitchLayer();
        const screen = document.getElementById('crt-screen');
        if (!layer || (!force && Math.random() > 0.075)) return;

        const rgbX = (Math.random() < .5 ? -1 : 1) * (1 + Math.floor(Math.random() * 4));
        const bandX = (Math.random() < .5 ? -1 : 1) * (8 + Math.floor(Math.random() * 22));
        layer.style.setProperty('--signal-rgb-x', `${rgbX}px`);
        layer.style.setProperty('--signal-band-x', `${bandX}px`);
        layer.style.setProperty('--signal-band-y', `${12 + Math.floor(Math.random() * 68)}%`);
        layer.style.setProperty('--signal-band-h', `${8 + Math.floor(Math.random() * 18)}%`);
        layer.style.setProperty('--signal-skew', `${(Math.random() < .5 ? -1 : 1) * (0.35 + Math.random() * 0.9)}deg`);

        safePulseClass(layer, 'signal-corrupting', 175);
        safePulseClass(screen, 'signal-corrupt-flash-safe', 175);
        if (force || Math.random() < .52) safePulseClass(layer, 'vhs-bursting', 360);
        safeCorruptVisibleText(force ? 4 : 2, force ? 170 : 105);
        safePersistentCharacterCorruptionTick(force);
    }

    function safeBootWarmup() {
        const screen = document.getElementById('crt-screen');
        safePulseClass(screen, 'tube-warming', 900);
        safePulseClass(safeGlitchLayer(), 'boot-warming', 730);
        setTimeout(() => safeTriggerSignalCorruption(true), 360);
        setTimeout(() => safeTriggerVHSTracking(true), 520);
    }

    function safeAudioJitter() {
        // Disabled: this translated #terminal-content by 1px on every sound/button press,
        // which made the whole CRT image appear to jog. Other glitch layers remain active.
        return;
    }

    function safeCorruptTextValue(value) {
        return String(value).split('').map(ch => {
            if (/\s/.test(ch) || Math.random() > 0.16) return ch;
            return safeGlitchGlyphs[Math.floor(Math.random() * safeGlitchGlyphs.length)];
        }).join('');
    }

    function safeCorruptVisibleText(count = 1, duration = 90) {
        if (!safeGlitchMotionOK()) return;
        const candidates = Array.from(document.querySelectorAll('#terminal-content .glitch, #terminal-content li, #terminal-content .path, #terminal-content [data-live-stat], #terminal-content [data-live-stat-label], #system-message div, #modal-loading .glitch'))
            .filter(el => el && el.childElementCount === 0 && el.textContent.trim().length > 3 && !el.dataset.cleanTextSafe);
        candidates.sort(() => Math.random() - .5).slice(0, count).forEach(el => {
            el.dataset.cleanTextSafe = el.textContent;
            el.classList.add('char-corrupt-safe');
            el.textContent = safeCorruptTextValue(el.textContent);
            setTimeout(() => {
                if (el.dataset.cleanTextSafe) el.textContent = el.dataset.cleanTextSafe;
                delete el.dataset.cleanTextSafe;
                el.classList.remove('char-corrupt-safe');
            }, duration);
        });
    }


    function safeTextNodeIsCorruptible(node) {
        if (!node || node.nodeType !== Node.TEXT_NODE) return false;
        const text = node.nodeValue || '';
        if (text.trim().length < 4) return false;
        const parent = node.parentElement;
        if (!parent) return false;
        if (parent.closest('script, style, noscript, input, textarea, select')) return false;
        if (parent.closest('.dead-pixel, .recursive-modal-ghost-safe, .no-char-corrupt')) return false;
        if (safeCharCorruptOriginals.has(node)) return false;

        const host = parent.closest('#terminal-content, #system-message, #image-modal, #idle-pet, .monitor-frame');
        if (!host) return false;

        const rects = parent.getClientRects();
        if (!rects || rects.length === 0) return false;
        const style = window.getComputedStyle(parent);
        if (style.visibility === 'hidden' || style.display === 'none' || Number(style.opacity) === 0) return false;
        return true;
    }

    function safeCollectTextNodesForPersistentCorruption() {
        const nodes = [];
        const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
            acceptNode(node) {
                return safeTextNodeIsCorruptible(node) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
            }
        });
        while (walker.nextNode()) nodes.push(walker.currentNode);
        return nodes;
    }

    function safeCorruptTextNode(node, duration = 140) {
        if (!safeTextNodeIsCorruptible(node)) return;
        const clean = node.nodeValue;
        safeCharCorruptOriginals.set(node, clean);
        if (node.parentElement) node.parentElement.classList.add('char-corrupt-persistent-safe');
        node.nodeValue = safeCorruptTextValue(clean);
        setTimeout(() => {
            const original = safeCharCorruptOriginals.get(node);
            if (typeof original === 'string') node.nodeValue = original;
            safeCharCorruptOriginals.delete(node);
            if (node.parentElement) node.parentElement.classList.remove('char-corrupt-persistent-safe');
        }, duration);
    }

    function safePersistentCharacterCorruptionTick(force = false) {
        if (!safeGlitchMotionOK() || document.hidden) return;
        if (!force && Math.random() > 0.72) return;
        const nodes = safeCollectTextNodesForPersistentCorruption();
        if (!nodes.length) return;

        const bursts = force ? 5 : (Math.random() < 0.16 ? 3 : 1);
        nodes.sort(() => Math.random() - 0.5).slice(0, bursts).forEach((node, i) => {
            setTimeout(() => safeCorruptTextNode(node, force ? 220 : 95 + Math.random() * 120), i * 35);
        });
    }

    function safeStartPersistentCharacterCorruption() {
        clearInterval(safePersistentCharTimer);
        safePersistentCharTimer = setInterval(() => safePersistentCharacterCorruptionTick(false), 520);
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) safePersistentCharacterCorruptionTick(true);
        });
    }

    function safeModalGhost() {
        const modal = document.getElementById('image-modal');
        const img = document.getElementById('modal-img');
        if (!modal || !img || modal.style.display !== 'flex' || !img.src || !safeGlitchMotionOK()) return;
        const rect = img.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        for (let i = 0; i < 3; i++) {
            const ghost = img.cloneNode(false);
            ghost.removeAttribute('id');
            ghost.className = 'recursive-modal-ghost-safe';
            ghost.style.left = `${rect.left}px`;
            ghost.style.top = `${rect.top}px`;
            ghost.style.width = `${rect.width}px`;
            ghost.style.height = `${rect.height}px`;
            ghost.style.setProperty('--modal-ghost-opacity', `${0.15 - i * 0.035}`);
            ghost.style.setProperty('--modal-ghost-x', `${(i + 1) * (Math.random() < .5 ? -3 : 3)}px`);
            ghost.style.setProperty('--modal-ghost-y', `${(i + 1) * 2}px`);
            ghost.style.animationDelay = `${i * 55}ms`;
            document.body.appendChild(ghost);
            setTimeout(() => ghost.remove(), 760 + i * 90);
        }
    }


    function safeTriggerVHSTracking(force = false) {
        const layer = safeGlitchLayer();
        const screen = document.getElementById('crt-screen');
        if (!layer || (!force && Math.random() > 0.11)) return;

        const y = 10 + Math.floor(Math.random() * 72);
        const h = 22 + Math.floor(Math.random() * 58);
        const x = (Math.random() < .5 ? -1 : 1) * (4 + Math.floor(Math.random() * 18));
        const skew = (Math.random() < .5 ? -1 : 1) * (0.25 + Math.random() * 1.1);

        layer.style.setProperty('--tracking-y', `${y}%`);
        layer.style.setProperty('--tracking-h', `${h}px`);
        layer.style.setProperty('--tracking-y2', `${Math.max(5, Math.min(88, y + 18 + Math.floor(Math.random() * 26)))}%`);
        layer.style.setProperty('--tracking-h2', `${10 + Math.floor(Math.random() * 22)}px`);
        layer.style.setProperty('--tracking-x', `${x}px`);
        layer.style.setProperty('--tracking-skew', `${skew.toFixed(2)}deg`);

        safePulseClass(layer, 'vhs-tracking', 650);
        safePulseClass(screen, 'vhs-tracking-kick-safe', 650);
    }

    function safeTerminalPanicEvent(force = false) {
        if (!force && (viewState === 'splash' || Math.random() > .45)) return;
        safeTriggerSyncTear(true);
        setTimeout(() => safeTriggerSignalCorruption(true), 80);
        setTimeout(() => safeTriggerVHSTracking(true), 135);
        setTimeout(() => safeTriggerSyncTear(true), 190);
        showSystemMessage('SIGNAL DESYNC DETECTED', [
            'RELOCKING MEMORY BANKS',
            'TRACKING ERROR: SELF-CORRECTED',
            'DO NOT ADJUST YOUR TERMINAL'
        ], 2200);
        [90, 1440, 410, 2200, 120].forEach((freq, i) => setTimeout(() => playSound(freq, i % 2 ? 'square' : 'sawtooth', 0.04, 0.03), i * 70));
    }

    function safeStartAmbientGlitches() {
        safeSeedDeadPixels();
        safeStartPersistentCharacterCorruption();
        clearInterval(safeGlitchInterval);
        clearInterval(safePanicTimer);
        safeGlitchInterval = setInterval(() => {
            safeTriggerSyncTear();
            safeTriggerSignalCorruption();
            safeTriggerVHSTracking();
            if (Math.random() < .018) safePersistentCharacterCorruptionTick(true);
        }, 1700);
        safePanicTimer = setInterval(() => safeTerminalPanicEvent(), 26000);
    }

    // Wrap existing functions instead of editing core logic.
    const originalPlaySound = playSound;
    playSound = function(freq, type, dur, vol) {
        safeAudioJitter();
        return originalPlaySound(freq, type, dur, vol);
    };

    const originalBootSystem = bootSystem;
    bootSystem = function() {
        safeBootWarmup();
        return originalBootSystem.apply(this, arguments);
    };

    const originalNavigateModalGallery = navigateModalGallery;
    navigateModalGallery = function(direction) {
        safeModalGhost();
        return originalNavigateModalGallery.apply(this, arguments);
    };

    const originalOpenModal = openModal;
    openModal = function() {
        safeModalGhost();
        return originalOpenModal.apply(this, arguments);
    };

    safeStartAmbientGlitches();

    /* --- Recursive modal ghosting v2: persistent while enlarged images are open --- */
    let safeRecursiveModalGhostTimer;

    function safeBurstModalGhosts(count = 3, spacing = 90) {
        if (!safeGlitchMotionOK()) return;
        for (let i = 0; i < count; i++) {
            setTimeout(() => safeModalGhost(), i * spacing);
        }
    }

    function safeStartRecursiveModalGhosting() {
        clearInterval(safeRecursiveModalGhostTimer);
        safeBurstModalGhosts(4, 85);
        safeRecursiveModalGhostTimer = setInterval(() => {
            const modal = document.getElementById('image-modal');
            if (!modal || modal.style.display !== 'flex') {
                clearInterval(safeRecursiveModalGhostTimer);
                return;
            }
            if (Math.random() < 0.72) safeModalGhost();
        }, 620);
    }

    function safeStopRecursiveModalGhosting() {
        clearInterval(safeRecursiveModalGhostTimer);
        document.querySelectorAll('.recursive-modal-ghost-safe').forEach(node => node.remove());
    }

    const originalOpenModalRecursiveGhost = openModal;
    openModal = function() {
        const result = originalOpenModalRecursiveGhost.apply(this, arguments);
        safeStartRecursiveModalGhosting();
        setTimeout(() => safeBurstModalGhosts(3, 110), 260);
        return result;
    };

    const originalNavigateModalGalleryRecursiveGhost = navigateModalGallery;
    navigateModalGallery = function(direction) {
        const result = originalNavigateModalGalleryRecursiveGhost.apply(this, arguments);
        safeBurstModalGhosts(5, 75);
        setTimeout(() => safeBurstModalGhosts(3, 95), 260);
        return result;
    };

    const originalCloseModalRecursiveGhost = closeModal;
    closeModal = function() {
        safeStopRecursiveModalGhosting();
        return originalCloseModalRecursiveGhost.apply(this, arguments);
    };

    const safeRecursiveModalImage = document.getElementById('modal-img');
    if (safeRecursiveModalImage) {
        safeRecursiveModalImage.addEventListener('load', () => {
            const modal = document.getElementById('image-modal');
            if (modal && modal.style.display === 'flex') {
                safeBurstModalGhosts(4, 80);
            }
        });
    }


    /* --- Recursive ghosting for the boot / splash screen --- */
    let safeRecursiveBootGhostTimer;

    function safeBootScreenGhost() {
        if (!safeGlitchMotionOK() || viewState !== 'splash') return;
        const source = document.querySelector('#terminal-content .card-view');
        if (!source) return;
        const rect = source.getBoundingClientRect();
        if (!rect.width || !rect.height) return;

        for (let i = 0; i < 3; i++) {
            const ghost = source.cloneNode(true);
            ghost.className = 'recursive-boot-ghost-safe';
            ghost.removeAttribute('onclick');
            ghost.querySelectorAll('[id]').forEach(node => node.removeAttribute('id'));
            ghost.querySelectorAll('[onclick], button, a, input').forEach(node => {
                node.removeAttribute('onclick');
                node.tabIndex = -1;
            });
            ghost.style.left = `${rect.left}px`;
            ghost.style.top = `${rect.top}px`;
            ghost.style.width = `${rect.width}px`;
            ghost.style.height = `${rect.height}px`;
            ghost.style.display = 'flex';
            ghost.style.flexDirection = 'column';
            ghost.style.alignItems = 'center';
            ghost.style.justifyContent = 'center';
            ghost.style.setProperty('--boot-ghost-opacity', `${0.13 - i * 0.03}`);
            ghost.style.setProperty('--boot-ghost-x', `${(i + 1) * (Math.random() < .5 ? -2 : 2)}px`);
            ghost.style.setProperty('--boot-ghost-y', `${(i + 1) * (Math.random() < .5 ? -1 : 2)}px`);
            ghost.style.animationDelay = `${i * 65}ms`;
            document.body.appendChild(ghost);
            setTimeout(() => ghost.remove(), 820 + i * 90);
        }
    }

    function safeBurstBootScreenGhosts(count = 4, spacing = 115) {
        if (!safeGlitchMotionOK()) return;
        for (let i = 0; i < count; i++) {
            setTimeout(() => safeBootScreenGhost(), i * spacing);
        }
    }

    function safeStartRecursiveBootGhosting() {
        clearInterval(safeRecursiveBootGhostTimer);
        document.querySelectorAll('.recursive-boot-ghost-safe').forEach(node => node.remove());
        safeBurstBootScreenGhosts(5, 90);
        safeRecursiveBootGhostTimer = setInterval(() => {
            if (viewState !== 'splash') {
                clearInterval(safeRecursiveBootGhostTimer);
                document.querySelectorAll('.recursive-boot-ghost-safe').forEach(node => node.remove());
                return;
            }
            if (Math.random() < 0.78) safeBootScreenGhost();
        }, 740);
    }

    const originalRenderSplashRecursiveBootGhost = renderSplash;
    renderSplash = function() {
        const result = originalRenderSplashRecursiveBootGhost.apply(this, arguments);
        setTimeout(() => safeStartRecursiveBootGhosting(), 40);
        return result;
    };

    const originalBootSystemRecursiveBootGhost = bootSystem;
    bootSystem = function() {
        clearInterval(safeRecursiveBootGhostTimer);
        document.querySelectorAll('.recursive-boot-ghost-safe').forEach(node => node.remove());
        return originalBootSystemRecursiveBootGhost.apply(this, arguments);
    };


    document.addEventListener('mousedown', resetIdle);
    startLiveSystemHeader();
    renderSplash();
</script>

</body>
</html>
