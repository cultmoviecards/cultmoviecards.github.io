            --bg-black: #050505;
            --scanline-color: rgba(18, 16, 16, 0.1);
        }

            background-color: var(--bg-black);
            color: var(--bright-green);
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-transform: uppercase;
            position: relative;
        }

        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.1) 50%
            ), linear-gradient(
                90deg, 
                rgba(255, 0, 0, 0.03), 
                rgba(0, 255, 0, 0.01), 
                rgba(0, 0, 255, 0.03)
            );
            z-index: 20;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        .scanline {
            width: 100%;
            height: 100px;
            z-index: 21;
            background: linear-gradient(
                0deg,
                rgba(0, 0, 0, 0) 0%,
                rgba(0, 255, 65, 0.05) 50%,
                rgba(0, 0, 0, 0) 100%
            );
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scanline 8s linear infinite;
        }

        @keyframes scanline {
            0% { top: 0%; }
            100% { top: 100%; }
        }

        .monitor-frame {
            padding: 30px;
            background: #1a1a1a;
            border: 15px solid #222;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0,0,0,1);
            position: relative;
            z-index: 5;
        }

        .crt-screen {
            width: 850px;
            height: 550px;
            background: var(--bg-black);
            position: relative;
            overflow: hidden;
            border: 2px solid #333;
        }

        .screen-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            background-size: 100% 2px;
            pointer-events: none;
            z-index: 10;
        }

        #terminal-content {
            padding: 10px;
            height: 100%;
            box-sizing: border-box;
            font-size: 11pt; 
            line-height: 1.2;
            letter-spacing: -0.5px;
            display: flex;
            flex-direction: column;
        }

        .system-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            border-bottom: 1px solid var(--dark-green);
            padding-bottom: 10px;
            margin-bottom: 10px;
            flex-shrink: 0;
            font-size: 9pt;
        }

        .stat-bar { color: #aaa; }
        .path { 
            background: var(--bright-green); 
            color: var(--bg-black); 
            padding: 2px 5px; 
            margin-bottom: 10px; 
            font-weight: bold;
            flex-shrink: 0;
        }
        
        ul { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex-grow: 1; }
        li { padding: 1px 5px; white-space: pre; cursor: pointer; }
        li.selected { background: var(--bright-green); color: var(--bg-black); }

        .keypad-grid {
            display: grid; 
            grid-template-columns: repeat(3, 45px); 
            gap: 5px; 
            margin-top: 15px;
        }

        .pin-btn {
            background: #000;
            border: 1px solid var(--bright-green);
            color: var(--bright-green);
            font-family: 'JetBrains Mono', monospace;
            padding: 5px;

        .metadata-table td { border: 1px solid var(--dark-green); padding: 2px 10px; }

        ::-webkit-scrollbar { width: 4px; }

    const terminal = document.getElementById('terminal-content');
    let inputBuffer = "";
    const CORRECT_PIN = "2038";
    let selectedIndex = 0;
    let viewState = "boot";
    let currentFolderName = "";

    function getHeader() {
        return `
            <div class="system-stats">
                <div>
                    1 [<span class="stat-bar">|||||||</span> 1.3%]   Tasks: 72, 105 thr; 1 running<br>
                    2 [<span class="stat-bar">||</span> 0.5%]        Load average: 0.03 0.04 0.05<br>
                    Mem[<span class="stat-bar">|||||||||||</span> 203/3017MB] Uptime: 22:44:50
                </div>
            </div>
        `;
    }

    function updateSelection() {
        const items = terminal.querySelectorAll('li, .pin-btn, .clickable');
        items.forEach((item, idx) => {
            if (idx === selectedIndex) {
                item.classList.add('selected');
                item.scrollIntoView({ block: "nearest" });
            } else {
                item.classList.remove('selected');
            }
        });
        playClick();
    }

    function handleKeyDown(e) {
        if (viewState === "boot") {
            if (e.key === "Enter") bootSystem();
            return;
        }

        const items = terminal.querySelectorAll('li, .pin-btn, .clickable');
        
        if (e.key === "ArrowDown") {
            selectedIndex = (selectedIndex + 1) % items.length;
            updateSelection();
        } else if (e.key === "ArrowUp") {
            selectedIndex = (selectedIndex - 1 + items.length) % items.length;
            updateSelection();
        } else if (e.key === "Enter") {
            if (items[selectedIndex]) items[selectedIndex].click();
        } else if (e.key === "Escape") {
            if (viewState === "dir") renderRoot();
            else if (viewState === "file") openDir(currentFolderName);
        } else if (!isNaN(e.key) && viewState === "pin") {
            pressKey(e.key);
        }
    }

    function bootSystem() {
        showLoginPrompt();
    }

    function showLoginPrompt() {
        viewState = "pin";
        playBleep();
        terminal.innerHTML = getHeader() + `
            <div class="card-view">
                <p>AUTHORIZATION REQUIRED</p>
                <h2 id="pin-display" style="letter-spacing: 12px; color: #fff;">____</h2>
                <p id="auth-status" style="height: 1.2em;"></p>
                <div class="keypad-grid">
                    ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="pin-btn" onclick="pressKey('${n}')">${n}</button>`).join('')}

                    <button class="pin-btn" onclick="pressKey('0')">0</button>
                    <button class="pin-btn" onclick="verifyPin()">ENT</button>
                </div>
            </div>
        `;
        selectedIndex = -1;
    }

    function pressKey(num) {
        if (inputBuffer.length < 4) {
            playClick();
            inputBuffer += num;
            document.getElementById('pin-display').innerText = inputBuffer.padEnd(4, "_");
        }
        if (inputBuffer.length === 4) verifyPin();
    }

    function resetPin() {
        playClick();
        inputBuffer = "";
        document.getElementById('pin-display').innerText = "____";
        document.getElementById('auth-status').innerText = "";
    }

    function verifyPin() {
        const status = document.getElementById('auth-status');
        if (inputBuffer === CORRECT_PIN) {
            playBleep();
            status.innerText = "ACCESS GRANTED";
            setTimeout(renderRoot, 600);
        } else {
            playError();
            status.innerText = "ACCESS DENIED";
            inputBuffer = "";
            document.getElementById('pin-display').innerText = "____";
        }
    }

        terminal.innerHTML = html;
        updateSelection();
    }

    html += `<li onclick="renderRoot()">drwxr-xr-x guest  ..          [BACK]</li>`;
    database[name].forEach((card, i) => {
        html += `<li onclick="viewCard('${name}', ${i})">-rw-r--r-- guest  ${card.size}  ${card.title}.IMG</li>`;
    });
    terminal.innerHTML = html + `</ul>`;
    updateSelection();
}

    function viewCard(dir, idx) {
    viewState = "file";
    const card = database[dir][idx];
    terminal.innerHTML = getHeader() + `<p>LOADING ${card.title}.IMG...</p><div style="width:100px; height:4px; background:var(--dark-green);"><div style="width:80%; height:100%; background:var(--bright-green);"></div></div>`;
    
    setTimeout(() => {
        // USE BACKTICKS HERE:
        terminal.innerHTML = getHeader() + `
            <div class="path">A:\\${dir.toUpperCase()}\\${card.title}.IMG</div>
            <div class="card-view">
                <img src="${card.file}" class="terminal-img" onerror="this.src='https://via.placeholder.com/400x300/050505/00FF41?text=ERR_SIGNAL'">
                <table class="metadata-table">
                    <tr><td>PID</td><td>${Math.floor(Math.random()*9000)+1000}</td><td>FILE</td><td>${card.title}.IMG</td></tr>
                    <tr><td>SIZE</td><td>${card.size}</td><td>DATE</td><td>${card.date}</td></tr>
                    <tr><td>LOG</td><td colspan="3">${card.caption}</td></tr>
                </table>
            </div>
            <p class="clickable selected" style="text-align:center; margin-top:5px;" onclick="openDir('${dir}')">[ ESC: CLOSE ]</p>
        `;
        selectedIndex = 0;
    }, 400);
}
</script>
