            gap: 20px;
            border-bottom: 1px solid var(--dark-green);
            padding-bottom: 8px;
            margin-bottom: 10px;
            font-size: 8.5pt;

            margin-bottom: 10px; 
            font-weight: bold;
        }

            display: grid;

            gap: 8px; 
            margin-top: 15px;
        }

        .pin-btn {
            background: transparent;
            border: 1px solid var(--bright-green);
            color: var(--bright-green);
            font-family: 'JetBrains Mono', monospace;
            padding: 10px;
            cursor: pointer;
        }

        .pin-btn.selected { background: var(--bright-green); color: #000; }

        .card-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;

        }

    const terminal = document.getElementById('terminal-content');
    let inputBuffer = "";
    const CORRECT_PIN = "2038";
    let selectedIndex = 0;
    let viewState = "boot";
    let currentFolderName = "";
    let currentFileIndex = 0;

    function getHeader() {
        const now = new Date();
        const timeStr = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0') + ":" + now.getSeconds().toString().padStart(2, '0');
        return `
            <div class="system-stats">
                <div>
                    CPU [<span style="color:white">||||||</span> 42%] <br>
                    MEM [<span style="color:white">|||</span> 1.2GB/8GB]
                </div>
                <div style="text-align: right">
                    USER: AUTH_GUEST<br>
                    TIME: ${timeStr}
                </div>
            </div>
        `;
    }

    function updateSelection() {
        const items = terminal.querySelectorAll('li, .pin-btn, .clickable');
        items.forEach((item, idx) => {
            item.classList.toggle('selected', idx === selectedIndex);
            if (idx === selectedIndex) item.scrollIntoView({ block: "nearest" });
        });
        playSound(800, 'square', 0.02, 0.05);
    }

    function handleKeyDown(e) {
        if (viewState === "boot") { bootSystem(); return; }

        const items = terminal.querySelectorAll('li, .pin-btn, .clickable');
        
        if (e.key === "ArrowDown") {
            selectedIndex = (selectedIndex + 1) % items.length;
            updateSelection();
        } else if (e.key === "ArrowUp") {
            selectedIndex = (selectedIndex - 1 + items.length) % items.length;
            updateSelection();
        } else if (e.key === "ArrowRight" && viewState === "file") {
            const nextIdx = (currentFileIndex + 1) % database[currentFolderName].length;
            viewCard(currentFolderName, nextIdx);
        } else if (e.key === "ArrowLeft" && viewState === "file") {
            const prevIdx = (currentFileIndex - 1 + database[currentFolderName].length) % database[currentFolderName].length;
            viewCard(currentFolderName, prevIdx);
        } else if (e.key === "Enter") {
            if (items[selectedIndex]) items[selectedIndex].click();
        } else if (e.key === "Escape") {
            if (viewState === "dir") renderRoot();
            else if (viewState === "file") openDir(currentFolderName);
        } else if (!isNaN(e.key) && viewState === "pin") {
            pressKey(e.key);
        }
    }

    function bootSystem() {
        showLoginPrompt();
    }

    function showLoginPrompt() {
        viewState = "pin";
        inputBuffer = "";
        playSound(440, 'sine', 0.1, 0.1);
        terminal.innerHTML = getHeader() + `
            <div class="card-view">
                <p class="glitch">AUTHORIZATION REQUIRED</p>
                <h2 id="pin-display" style="letter-spacing: 12px; color: #fff; border: 1px solid var(--dark-green); padding: 10px;">____</h2>
                <p id="auth-status" style="height: 1.2em; color: red;"></p>
                <div class="keypad-grid">
                    ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="pin-btn" onclick="pressKey('${n}')">${n}</button>`).join('')}
                    <button class="pin-btn" onclick="resetPin()">CLR</button>
                    <button class="pin-btn" onclick="pressKey('0')">0</button>
                    <button class="pin-btn" onclick="verifyPin()">ENT</button>
                </div>
            </div>
        `;
        selectedIndex = -1;
    }

    function pressKey(num) {
        if (inputBuffer.length < 4) {
            inputBuffer += num;
            document.getElementById('pin-display').innerText = inputBuffer.padEnd(4, "_");
            playSound(1200, 'triangle', 0.02, 0.1);
        }
        if (inputBuffer.length === 4) setTimeout(verifyPin, 250);
    }

    function resetPin() {
        inputBuffer = "";
        document.getElementById('pin-display').innerText = "____";
        playSound(200, 'sawtooth', 0.1, 0.1);
    }

    function verifyPin() {
        const status = document.getElementById('auth-status');
        if (inputBuffer === CORRECT_PIN) {
            playSound(1000, 'sine', 0.4, 0.1);
            status.style.color = "var(--bright-green)";
            status.innerText = "ACCESS GRANTED - DECRYPTING...";
            setTimeout(renderRoot, 800);
        } else {
            playSound(150, 'sawtooth', 0.5, 0.2);
            status.innerText = "INVALID ACCESS CODE";
            inputBuffer = "";
            document.getElementById('pin-display').innerText = "____";
        }
    }

    function renderRoot() {
        viewState = "root";
        selectedIndex = 0;
        let html = getHeader() + `<div class="path">A:\ROOT</div><ul>`;
        for (let folder in database) {
            html += `<li onclick="openDir('${folder}')">drwxr-xr-x   [DIR]  ${folder.toUpperCase()}</li>`;
        }
        html += `</ul><p style="font-size:8pt; opacity:0.5; padding:10px;">TOTAL FOLDERS: ${Object.keys(database).length}</p>`;
        terminal.innerHTML = html;
        updateSelection();
    }

    function openDir(name) {
        viewState = "dir";
        selectedIndex = 1;
        currentFolderName = name;
        let html = getHeader() + `<div class="path">A:\\${name.toUpperCase()}</div><ul>`;
        html += `<li onclick="renderRoot()">[..] GO BACK</li>`;
        database[name].forEach((card, i) => {
            html += `<li onclick="viewCard('${name}', ${i})">-rw-r--r--   ${card.size}   ${card.title}.IMG</li>`;
        });
        terminal.innerHTML = html + `</ul>`;
        updateSelection();
    }

    function viewCard(dir, idx) {
        viewState = "file";
        currentFileIndex = idx;
        const folder = database[dir];
        const card = folder[idx];
        
        const nextIdx = (idx + 1) % folder.length;
        const prevIdx = (idx - 1 + folder.length) % folder.length;

        terminal.innerHTML = getHeader() + `<div class="path">LOADING: ${card.title}</div><div class="card-view"><p class="glitch">READING SECTOR ${Math.floor(Math.random()*500)}...</p></div>`;
        
        setTimeout(() => {
            terminal.innerHTML = getHeader() + `
                <div class="path">A:\\${dir.toUpperCase()}\\${card.title}.IMG</div>
                <div class="card-view">
                    <img src="${card.file}" class="terminal-img" onerror="this.src='https://via.placeholder.com/400x300/050505/00FF41?text=SIGNAL_LOST'">
                    
                    <div style="display: flex; gap: 30px; margin-bottom: 10px;">
                        <span class="clickable" onclick="viewCard('${dir}', ${prevIdx})">[ PREVIOUS ]</span>
                        <span style="color: var(--dark-green)">|</span>
                        <span class="clickable" onclick="viewCard('${dir}', ${nextIdx})">[ NEXT ]</span>
                    </div>

                    <table class="metadata-table">
                        <tr><td>REF_ID</td><td>${card.id}</td><td>INDEX</td><td>${idx + 1} / ${folder.length}</td></tr>
                        <tr><td>DATA</td><td colspan="3">${card.caption}</td></tr>
                    </table>
                    
                    <p class="clickable selected" style="margin-top:15px; border:1px solid; padding:5px 20px;" onclick="openDir('${dir}')">[ ESC: RETURN TO LIST ]</p>
                </div>
            `;
            // Focus the "Return" button by default
            selectedIndex = 2; // Index of the Return button in the .clickable list
        }, 300);
    }
</script>
